<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Toàn Diện - Thư Viện Phật Giáo</title>
    <style>
        :root { --den: #000; --vang: #ccff00; --do: #ff4444; }
        body { background: var(--den); color: #fff; font-family: Arial, sans-serif; padding: 20px; }
        #lockScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .lock-box { border: 2px solid var(--vang); padding: 40px; border-radius: 20px; text-align: center; }
        #mainContent { display: none; max-width: 1000px; margin: auto; }
        .tab-menu { display: flex; gap: 10px; margin: 20px 0; }
        .tab-btn { flex: 1; padding: 15px; background: #111; color: #fff; border: 1px solid var(--vang); cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: var(--vang); color: #000; }
        table { width: 100%; border-collapse: collapse; background: #111; }
        th, td { padding: 15px; border-bottom: 1px solid #333; text-align: left; }
        .btn-edit { background: #f1c40f; padding: 8px; border: none; cursor: pointer; margin-right: 5px; }
        .btn-del { background: var(--do); padding: 8px; border: none; color: #fff; cursor: pointer; }
    </style>
</head>
<body>

<div id="lockScreen">
    <div class="lock-box">
        <h2 style="color:var(--vang)">MẬT KHẨU QUẢN TRỊ</h2>
        <input type="password" id="passInput" style="padding:10px; font-size:20px; text-align:center;"><br><br>
        <button onclick="checkPass()" style="padding:10px 30px; background:var(--vang); font-weight:bold; cursor:pointer;">MỞ KHÓA</button>
    </div>
</div>

<div id="mainContent">
    <h1>QUẢN LÝ NỘI DUNG</h1>
    <div class="tab-menu">
        <button id="btn-Nikaya_Texts" class="tab-btn active" onclick="switchTab('Nikaya_Texts')">1. KINH GỐC</button>
        <button id="btn-Infographics_Library" class="tab-btn" onclick="switchTab('Infographics_Library')">2. INFOGRAPHIC</button>
        <button id="btn-Video_Shorts" class="tab-btn" onclick="switchTab('Video_Shorts')">3. VIDEO</button>
    </div>
    <table>
        <thead><tr><th>Tiêu đề</th><th>Thao tác</th></tr></thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
        messagingSenderId: "342500331725",
        appId: "1:342500331725:web:32795cf0146210f8019984"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let currentTab = 'Nikaya_Texts';

    window.checkPass = () => {
        if (document.getElementById('passInput').value === 'admin@8899') {
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            loadPosts();
        } else { alert("Sai mật khẩu!"); }
    };

    async function loadPosts() {
        const snap = await getDocs(collection(db, currentTab));
        const body = document.getElementById('tableBody');
        body.innerHTML = "";
        snap.forEach((docSnap) => {
            const d = docSnap.data();
            // SỬA LỖI TRỰC TIẾP: Lấy bất cứ cái tên nào có dữ liệu
            const title = d.title || d.title_vi || d.tieu_de || "Bài chưa có tựa";
            body.innerHTML += `
                <tr>
                    <td>${title}</td>
                    <td>
                        <button class="btn-del" onclick="deletePost('${docSnap.id}')">XÓA</button>
                    </td>
                </tr>`;
        });
    }

    window.deletePost = async (id) => {
        if(confirm("Xóa vĩnh viễn bài này?")) {
            await deleteDoc(doc(db, currentTab, id));
            loadPosts();
        }
    };

    window.switchTab = (tab) => {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + tab).classList.add('active');
        loadPosts();
    };
</script>
</body>
</html>
