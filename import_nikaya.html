    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 11: Phẩm Già (Jarā Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-011.jpg",
            content_full: `SỐ CÂU KỆ: 146 ĐẾN 156

1. GIỚI THIỆU SƠ LƯỢC
Phẩm Già (Jarā Vagga) dùng những hình ảnh thực tế về sự suy tàn của cơ thể để thức tỉnh chúng ta khỏi sự mê đắm vào vẻ đẹp và sức trẻ tạm bợ. Đức Phật dạy rằng khi cuộc đời đầy rẫy sự già nua và cái chết bao vây, việc tìm cầu ánh sáng trí tuệ là nhiệm vụ cấp bách nhất.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 146: Tìm kiếm ánh sáng giữa đêm tối
"Cười gì, hân hoan gì,
Khi đời mãi bị thiêu?
Bị tối tăm bao trùm,
Sao không tìm ánh sáng?"

Giải thích: Thế gian này luôn bị thiêu đốt bởi ngọn lửa của già, bệnh và chết. Khi chúng ta đang sống trong sự vô minh (tối tăm), tại sao lại mải mê với những thú vui hời hợt mà không lo tìm kiếm ngọn đuốc trí tuệ để soi đường thoát khỏi khổ đau?

● Kệ số 148: Sự tàn tạ của thân xác
"Sắc thân bị già yếu,
Ổ bệnh, dễ nát tan,
Đống uế trược tan rã,
Sống ắt phải có chết."

Giải thích: Cơ thể này dù có được chăm sóc kỹ lưỡng đến đâu cũng sẽ đến lúc già nua, bệnh tật. Nó giống như một chiếc xe cũ nát dần theo thời gian. Hiểu rõ sự thật này giúp chúng ta bớt bám chấp vào thân xác và tập trung rèn luyện phẩm chất nội tâm.

● Kệ số 153 & 154: Bài kệ khải hoàn của Đức Phật
"Lang thang bao kiếp sống,
Ta tìm thợ xây nhà,
Khổ thay, luân hồi mãi,
Nay ta thấy ngươi rồi!" (Kệ 153)

"Người thợ xây nhà kia,
Ngươi không xây được nữa,
Kèo cột đều gãy đổ,
Tâm ta đạt tịch diệt." (Kệ 154)

Giải thích: Đây là lời tuyên bố khi Đức Phật thành đạo. "Người thợ xây nhà" chính là ái dục (ham muốn) đã dẫn dắt ta đi luân hồi bao kiếp. Khi trí tuệ phát sinh, ta nhận diện được nó và phá hủy mọi "cột kèo" của phiền não, đạt đến sự bình an tuyệt đối (Niết bàn).

3. BÀI HỌC ỨNG DỤNG
- Chấp nhận quy luật: Đừng đau khổ khi thấy mình già đi hay yếu hơn, hãy xem đó là quy luật tự nhiên để trân trọng thời gian hiện tại.
- Ưu tiên giá trị tâm hồn: Sức khỏe và vẻ đẹp có thể mất đi, nhưng trí tuệ và lòng tốt thì luôn tồn tại và dẫn dắt ta.
- Tìm kiếm "Người thợ xây": Luôn quan sát xem ham muốn nào đang dẫn dắt mình để chủ động buông bỏ, tìm lại sự tự do cho tâm hồn.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã nạp thành công Kinh Pháp Cú Tập 11!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
