    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 16: Phẩm Hỷ Ái (Piya Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-016.jpg",
            content_full: `SỐ CÂU KỆ: 209 ĐẾN 220

1. GIỚI THIỆU SƠ LƯỢC
Phẩm Hỷ Ái (Piya Vagga) giúp chúng ta nhận ra rằng những gì ta yêu quý và bám chấp thường là nguồn gốc của nỗi sầu muộn và sợ hãi. Đức Phật dạy rằng khi ta bớt đi sự ích kỷ trong tình cảm và những mong cầu quá mức, tâm trí sẽ trở nên vững vàng và tự tại hơn trước những thăng trầm của cuộc đời.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 211: Đừng vướng vào yêu ghét
"Chớ gần gũi người yêu,
Chớ gần gũi người ghét,
Yêu không gặp là khổ,
Ghét phải gặp cũng sầu."

Giải thích: Tâm lý con người thường bị kẹt giữa hai thái cực: khao khát người mình yêu và xua đuổi người mình ghét. Sự lệ thuộc vào cảm xúc yêu - ghét này khiến chúng ta luôn bất ổn. Người trí giữ tâm quân bình, không để những cảm xúc này dẫn dắt quá mức.

● Kệ số 212 & 213: Nguồn gốc của sầu lo
"Ái luyến sinh sầu ưu,
Ái luyến sinh sợ hãi,
Ai thoát khỏi ái luyến,
Không sầu, đâu sợ hãi?" (Kệ 212)

"Hỷ ái sinh sầu ưu,
Hỷ ái sinh sợ hãi,
Ai thoát khỏi hỷ ái,
Không sầu, đâu sợ hãi?" (Kệ 213)

Giải thích: Càng bám chấp, yêu thích một vật hay một người theo cách chiếm hữu, ta càng lo sợ bị mất mát. Khi ta hiểu được tính vô thường và học cách yêu thương trong sự buông xả, nỗi lo sợ sẽ tự nhiên tan biến, nhường chỗ cho sự bình an.

● Kệ số 214: Sự nguy hại của dục lạc
"Tham ái sinh sầu ưu,
Tham ái sinh sợ hãi,
Ai thoát khỏi tham ái,
Không sầu, đâu sợ hãi?"

Giải thích: Tham ái (sự thèm khát, ham muốn mạnh mẽ) chính là sợi dây trói buộc ta vào vòng xoáy của khổ đau. Chỉ có trí tuệ nhận diện được bản chất giả tạm của các dục lạc mới có thể giúp ta cắt đứt sợi dây này.

3. BÀI HỌC ỨNG DỤNG
- Yêu thương tỉnh thức: Hãy yêu thương mọi người bằng sự thấu hiểu và sẻ chia, thay vì sự ràng buộc và kiểm soát.
- Quan sát tâm yêu ghét: Mỗi khi thấy mình quá vui hay quá buồn vì một mối quan hệ, hãy nhắc nhở mình về tính vô thường của mọi sự.
- Rèn luyện nội lực: Tìm kiếm niềm vui từ bên trong thông qua việc tu tập, thay vì luôn chờ đợi sự công nhận hay tình cảm từ bên ngoài.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã nạp thành công Kinh Pháp Cú Tập 16!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
