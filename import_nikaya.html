        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",

    const app = initializeApp(firebaseConfig);

    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 24: Phẩm Tham Ái (Taṇhā Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-024.jpg",
            content_full: `SỐ CÂU KỆ: 334 ĐẾN 359

1. GIỚI THIỆU SƠ LƯỢC
Phẩm Tham Ái (Taṇhā Vagga) vạch trần bản chất của lòng tham - thứ dây leo chằng chịt trói buộc con người vào vòng luân hồi. Đức Phật dạy rằng tham ái giống như một dòng sông chảy xiết, nếu không có trí tuệ để ngăn chặn, nó sẽ cuốn trôi mọi sự bình an và dẫn dắt chúng ta đến những nẻo đường sầu khổ.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 334: Tham ái như dây leo
"Người sống đời phóng dật,
Tham ái như dây leo,
Nhảy nhót kiếp này khác,
Như khỉ tìm trái cây."

Giải thích: Khi tâm không tỉnh giác, lòng tham sẽ mọc lên nhanh chóng và chằng chịt như loài dây leo Maluva. Nó khiến ta không bao giờ thấy đủ, luôn khao khát hết thứ này đến thứ khác, giống như con khỉ chuyền cành tìm trái ngọt mà không bao giờ dừng lại để hưởng thụ sự bình yên.

● Kệ số 338: Cắt đứt tận gốc rễ
"Cây bị chặt còn gốc,
Vẫn mọc lại xanh tươi,
Tham ái không nhổ gốc,
Khổ não lại sinh thôi."

Giải thích: Nếu chỉ cắt bỏ phần ngọn (hành động bên ngoài) mà không nhổ sạch gốc rễ (ý muốn bên trong), thì tham ái sẽ sớm muộn quay trở lại. Việc tu tập đòi hỏi sự triệt để: phải dùng trí tuệ để nhận diện và buông bỏ tận sâu trong tâm thức.

● Kệ số 348: Tự do thực sự
"Bỏ trước, bỏ sau chót,
Bỏ giữa, đến bờ kia,
Tâm thoát ly tất cả,
Không sinh già chết nữa."

Giải thích: Đây là lời dạy về sự buông xả toàn diện. Đừng bám chấp vào quá khứ (trước), đừng lo âu về tương lai (sau) và đừng dính mắc vào hiện tại (giữa). Khi tâm không còn gì để nắm giữ, ta sẽ đạt đến sự tự do tuyệt đối, vượt ra ngoài mọi nỗi khổ của sinh tử.

3. BÀI HỌC ỨNG DỤNG
- Nhận diện "dây leo": Khi thấy mình quá khao khát một món đồ hay một tình cảm, hãy nhắc mình đó là sợi dây đang trói buộc sự tự do của mình.
- Tu tập từ gốc: Đừng chỉ cố gắng tỏ ra đạo đức bên ngoài, hãy quan sát và sửa đổi những ý nghĩ tham lam nhỏ nhất ngay trong tâm.
- Sống trọn vẹn hiện tại: Học cách hài lòng với những gì đang có để tâm không còn phải nhảy nhót tìm cầu như con khỉ tìm trái cây.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã nạp thành công Kinh Pháp Cú Tập 24!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
</script>
