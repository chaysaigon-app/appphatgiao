        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",

    const app = initializeApp(firebaseConfig);

    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 9: Phẩm Ác (Papa Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-009.jpg",
            content_full: `SỐ CÂU KỆ: 116 ĐẾN 128

1. GIỚI THIỆU SƠ LƯỢC
Phẩm Ác (Papa Vagga) tập trung vào quy luật Nhân Quả khắt khe của những hành động bất thiện. Đức Phật dạy rằng không có việc ác nào là quá nhỏ để có thể bỏ qua, và cũng không có nơi nào trên thế gian này — dù là hang sâu hay đáy biển — giúp con người trốn thoát được quả báo của những việc mình đã làm.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 116: Gấp rút làm việc lành
"Hãy gấp làm việc lành,
Ngăn tâm làm việc ác,
Ai chậm làm việc thiện,
Tâm sẽ ưa việc ác."

Giải thích: Tâm con người có xu hướng dễ dãi và sa ngã. Nếu chúng ta không chủ động và khẩn trương lấp đầy tâm trí bằng những suy nghĩ và hành động tử tế, thì sự lười biếng và những thói quen xấu sẽ tự động xâm chiếm. Làm việc thiện chính là cách tốt nhất để bảo vệ mình khỏi cái ác.

● Kệ số 121: Đừng khinh thường việc ác nhỏ
"Chớ khinh khinh việc ác,
Cho rằng: 'Chưa đến mình',
Như nước nhỏ từng giọt,
Bình tràn đầy lúc nào."

Giải thích: Nhiều người thường chủ quan cho rằng một lời nói dối nhỏ hay một hành động ích kỷ lẻ tẻ sẽ không gây ra hậu quả gì lớn. Nhưng thực tế, những sai lầm nhỏ tích tụ lâu ngày sẽ tạo thành một thói quen xấu khổng lồ, giống như từng giọt nước nhỏ li ti cuối cùng sẽ làm tràn cả một chiếc bình lớn.

● Kệ số 127: Không nơi trốn tránh ác nghiệp
"Chẳng phải trên hư không,
Chẳng phải giữa đại dương,
Chẳng phải lánh hang sâu,
Không đâu trên đời này,
Trốn khỏi nghiệp đã làm."

Giải thích: Khi một hành động sai trái đã được thực hiện, nó trở thành một phần của nghiệp lực. Dù ta có cố gắng che giấu hay chạy trốn đến những nơi xa xôi nhất, thì khi nhân duyên hội đủ, quả báo vẫn sẽ tìm đến. Cách duy nhất là đối diện và sửa đổi ngay từ bây giờ.

3. BÀI HỌC ỨNG DỤNG
- Chánh niệm từng giây: Luôn quan sát ý nghĩ để dập tắt những mầm mống bất thiện ngay khi chúng vừa khởi phát.
- Trân trọng cơ hội làm thiện: Coi việc giúp đỡ người khác hoặc giữ tâm bình thản là một nhiệm vụ cấp bách.
- Chịu trách nhiệm: Hiểu rằng mọi sự không may trong hiện tại đều có gốc rễ từ những hành động cũ, từ đó nỗ lực tạo nhân thiện mới để thay đổi tương lai.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã nạp thành công Kinh Pháp Cú Tập 9!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
</script>
