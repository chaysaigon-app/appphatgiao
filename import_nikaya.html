<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <style>
        body { background: #000; color: #fff; font-family: Arial; padding: 50px; text-align: center; }
        .box { border: 2px solid #ccff00; padding: 30px; border-radius: 20px; display: inline-block; }

</head>
<body>

<div class="box">
    <h2 style="color: #ccff00;">NẠP BÀI: KINH PHÁP CÚ - TẬP 6: PHẨM HIỀN TRÍ</h2>
    <p>Nội dung chi tiết Kinh gốc và Giải thích</p>
    <button id="uploadBtn">XÁC NHẬN NẠP DỮ LIỆU</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
        messagingSenderId: "342500331725",
        appId: "1:342500331725:web:32795cf0146210f8019984"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 6: Phẩm Hiền Trí (Pandita Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-006.jpg",
            content_full: `SỐ CÂU KỆ: 76 ĐẾN 89

1. GIỚI THIỆU SƠ LƯỢC
Đối lập với Phẩm Ngu, Phẩm Hiền Trí mô tả chân dung của những người có trí tuệ thực sự. Người hiền trí không chỉ là người thông minh, mà là người biết lắng nghe lời phê bình, biết tự điều phục bản thân và luôn giữ tâm bình thản trước mọi biến động của cuộc đời.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 76: Giá trị của lời phê bình
"Nếu thấy người có trí,
Chỉ lỗi và khiển trách,
Như chỉ kho báu vật,
Hãy thân cận người trí."

Giải thích: Một người dám chỉ ra sai lầm của ta một cách chân thành giống như một người đang chỉ cho ta thấy kho báu bị chôn giấu. Thay vì tự ái hay giận dỗi, người hiền trí luôn trân trọng những lời góp ý đó để hoàn thiện bản thân mỗi ngày.

● Kệ số 80: Sự tự điều phục
"Thợ thủy dẫn nước đi,
Thợ tên uốn tên thẳng,
Thợ mộc uốn nắn gỗ,
Bậc trí tự điều tâm."

Giải thích: Người thợ làm thủy lợi biết điều hướng dòng nước, người thợ làm tên biết uốn thẳng mũi tên cứng cỏi. Cũng vậy, người có trí tuệ coi việc làm chủ và uốn nắn tâm trí mình là nhiệm vụ quan trọng nhất, không để tâm bị cuốn theo những cảm xúc nhất thời.

● Kệ số 81: Bình thản trước khen chê
"Như tảng đá kiên cố,
Không gió nào lay động,
Cũng vậy, giữa khen chê,
Người trí không dao động."

Giải thích: Thế gian luôn đầy rẫy những lời khen ngợi và chê bai. Người hiền trí rèn luyện nội tâm vững chãi như một tảng đá lớn; dù gió bão của dư luận hay những lời thị phi ập đến, họ vẫn giữ được sự bình tĩnh và sáng suốt.

3. BÀI HỌC ỨNG DỤNG
- Học cách lắng nghe: Đừng vội phản kháng khi nghe lời góp ý; hãy xem đó là cơ hội để tìm thấy "kho báu" trong nhân cách.
- Rèn luyện tính tự chủ: Luôn dành thời gian để quan sát và điều hướng suy nghĩ của mình theo hướng tích cực.
- Giữ tâm vững chãi: Đừng để hạnh phúc của bạn phụ thuộc vào lời khen của người khác hay bị tổn thương bởi những lời chê bai không đúng.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã nạp thành công Kinh Pháp Cú Tập 6!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
</script>
</body>
</html>
