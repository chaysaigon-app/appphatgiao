    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 13: Phẩm Thế Gian (Loka Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-013.jpg",
            content_full: `SỐ CÂU KỆ: 167 ĐẾN 178

1. GIỚI THIỆU SƠ LƯỢC
Phẩm Thế Gian (Loka Vagga) giúp chúng ta nhận diện bản chất thật sự của thế giới quanh mình. Đức Phật dạy rằng thế gian này giống như một chiếc xe lộng lẫy dành cho vua chúa, khiến người mê muội thì đắm say nhưng người trí tuệ thì nhìn thấu sự trống rỗng bên trong để không bị ràng buộc.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 170: Nhìn đời bằng trí tuệ
"Hãy nhìn như bọt nước,
Hãy nhìn như cảnh mộng,
Ai nhìn đời như vậy,
Thần chết không thấy mặt."

Giải thích: Nếu bạn nhìn cuộc đời, tiền tài và danh vọng giống như bọt nước tan nhanh hay một giấc mơ ngắn ngủi, bạn sẽ không còn bám chấp. Khi tâm trí không còn bị trói buộc bởi tham muốn, cái chết và sự lo âu không còn quyền năng gì đối với bạn.

● Kệ số 171: Chiếc xe lộng lẫy của thế gian
"Hãy đến nhìn thế gian,
Như xe vua lộng lẫy,
Người ngu đang chìm đắm,
Kẻ trí chẳng bận tâm."

Giải thích: Thế gian này đầy rẫy những cám dỗ rực rỡ bên ngoài. Kẻ thiếu trí tuệ sẽ mải mê đuổi theo và mắc kẹt trong đó. Nhưng người có trí hiểu rằng tất cả chỉ là lớp vỏ bọc bên ngoài, nên họ giữ được sự thong dong, không bị cuốn vào vòng xoáy của danh lợi.

● Kệ số 174: Ra khỏi lưới mê
"Thế gian này mù quáng,
Ít người nhìn thấy rõ,
Như chim thoát khỏi lưới,
Ít người đi cõi lành."

Giải thích: Phần lớn con người sống trong sự mù mờ của bản ngã và tham dục. Chỉ có rất ít người đủ tỉnh táo để nhìn thấu sự thật và tự giải thoát mình ra khỏi những cạm bẫy của cuộc đời, giống như chú chim hiếm hoi thoát ra khỏi lưới của thợ săn.

3. BÀI HỌC ỨNG DỤNG
- Giảm bớt sự bám chấp: Tập thói quen nhìn nhận mọi thứ quanh mình là tạm thời để lòng nhẹ nhàng hơn khi có sự thay đổi.
- Sống tỉnh thức: Đừng để vẻ hào nhoáng của vật chất làm mờ mắt; hãy luôn kiểm tra xem giá trị thật sự bên trong là gì.
- Quyết tâm thoát lưới: Mỗi ngày dành ít thời gian thiền định hoặc đọc kinh để làm sạch tâm trí, giúp mình có thêm sức mạnh để vượt qua những thói quen xấu.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã nạp thành công Kinh Pháp Cú Tập 13!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
