<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nạp Kinh Pháp Cú Tập 4 - Kinh Gốc</title>
    <style>
        body { background: #000; color: #fff; font-family: Arial; padding: 50px; text-align: center; }

<body>

<div class="box">
    <h2 style="color: #ccff00;">NẠP BÀI: KINH PHÁP CÚ - TẬP 4: PHẨM HOA</h2>
    <p>Nội dung chi tiết Kinh gốc và Giải thích</p>
    <button id="uploadBtn">XÁC NHẬN NẠP DỮ LIỆU</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
        messagingSenderId: "342500331725",
        appId: "1:342500331725:web:32795cf0146210f8019984"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 4: Phẩm Hoa (Puppha Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-004.jpg",
            content_full: `SỐ CÂU KỆ: 44 ĐẾN 59

1. GIỚI THIỆU SƠ LƯỢC
Phẩm Hoa sử dụng hình ảnh những đóa hoa rực rỡ nhưng mau tàn để nhắc nhở về sự vô thường của kiếp người. Đồng thời, Đức Phật nhấn mạnh rằng đức hạnh của con người mới là loại hương thơm quý giá nhất, có khả năng bay ngược chiều gió và tồn tại mãi với thời gian.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 47: Cái chết và sự hưởng thụ
"Người nhặt các loại hoa,
Ý đắm say tham nhiễm,
Bị tử thần mang đi,
Như lụt trôi làng ngủ."

Giải thích: Con người thường mải mê theo đuổi những thú vui tạm bợ như người đi hái hoa mà quên mất rằng cái chết có thể ập đến bất cứ lúc nào. Giống như một trận đại hồng thủy bất ngờ cuốn trôi cả một ngôi làng đang say ngủ, sự vô thường sẽ mang ta đi khi ta còn chưa kịp tỉnh thức.

● Kệ số 50: Nhìn lại chính mình
"Không nên nhìn lỗi người,
Người làm hay không làm,
Nên nhìn tự thân mình,
Có làm hay không làm."

Giải thích: Thay vì dành thời gian để soi xét, phán xét những sai lầm hay thiếu sót của người khác, chúng ta nên quay về quan sát chính bản thân mình. Hãy kiểm tra xem mình đã làm được điều thiện chưa, đã bỏ được thói xấu chưa. Đó mới là con đường dẫn đến sự tiến bộ thực sự.

● Kệ số 54: Hương thơm đức hạnh
"Hương các loại hoa thơm,
Không bay ngược chiều gió,
Nhưng hương người đức hạnh,
Bay khắp mọi phương trời."

Giải thích: Mùi hương của các loài hoa dù quý giá đến mấy cũng chỉ bay theo chiều gió. Thế nhưng, tiếng thơm từ lòng tốt, sự bao dung và đạo đức của một người thì có sức lan tỏa mãnh liệt, vượt qua mọi ranh giới và được mọi người khắp nơi kính trọng.

3. BÀI HỌC ỨNG DỤNG
- Ý thức về vô thường: Trân trọng mỗi phút giây đang sống và không quá bám chấp vào những vẻ đẹp bề ngoài mau tàn.
- Tu thân trước tiên: Tập trung sửa mình thay vì chỉ trích người khác.
- Xây dựng đức hạnh: Hãy để cuộc đời bạn tỏa hương bằng những hành động tử tế và lời nói ái ngữ mỗi ngày.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã nạp thành công Kinh Pháp Cú Tập 4!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
</script>
</body>
</html>
