<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nạp Kinh Pháp Cú Tập 20 - Kinh Gốc</title>
    <style>
        body { background: #000; color: #fff; font-family: Arial; padding: 50px; text-align: center; }
        .box { border: 2px solid #ccff00; padding: 30px; border-radius: 20px; display: inline-block; }
        button { padding: 15px 30px; background: #ccff00; border: none; font-weight: bold; cursor: pointer; border-radius: 10px; font-size: 20px; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="box">
    <h2 style="color: #ccff00;">NẠP BÀI: KINH PHÁP CÚ - TẬP 20: PHẨM ĐẠO</h2>
    <p>Nội dung chi tiết Kinh gốc và Giải thích về Bát Chánh Đạo</p>
    <button id="uploadBtn">XÁC NHẬN NẠP DỮ LIỆU</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
        messagingSenderId: "342500331725",
        appId: "1:342500331725:web:32795cf0146210f8019984"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 20: Phẩm Đạo (Magga Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-020.jpg",
            content_full: `SỐ CÂU KỆ: 273 ĐẾN 289

1. GIỚI THIỆU SƠ LƯỢC
Phẩm Đạo (Magga Vagga) chỉ ra con đường Bát Chánh Đạo là con đường thù thắng nhất trong tất cả các đạo. Đức Phật khẳng định rằng chỉ có việc thực hành theo lộ trình này mới có thể giúp chúng ta phá tan những ảo ảnh của bản ngã và đạt đến sự chấm dứt hoàn toàn nỗi khổ niềm đau.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 273: Con đường độc nhất
"Tám ngành, đường thù thắng,
Bốn đế, lý thù thắng,
Ly tham, pháp thù thắng,
Giác giả, bậc thù thắng."

Giải thích: Trong mọi con đường, con đường tám nhánh (Bát Chánh Đạo) là tuyệt vời nhất. Trong mọi chân lý, Bốn sự thật (Tứ Diệu Đế) là cao quý nhất. Trong mọi trạng thái, sự buông xả (Ly tham) là hạnh phúc nhất. Và trong mọi chúng sinh, bậc Giác ngộ là tôn kính nhất.

● Kệ số 276: Tự mình nỗ lực
"Tự mình phải nỗ lực,
Như Lai chỉ dạy đường,
Ai hành trì thiền định,
Thoát khỏi vòng Ma vương."

Giải thích: Đức Phật ví Ngài như một người chỉ đường tận tụy, nhưng Ngài không thể đi thay chúng ta. Mỗi người phải tự mình nỗ lực thực hành, rèn luyện chánh niệm và thiền định mới có thể tự cởi bỏ những sợi dây ràng buộc của phiền não và đạt đến tự do.

● Kệ số 277, 278 & 279: Ba dấu ấn của thực tại
"Các hành đều vô thường,
Các hành đều khổ não,
Các pháp đều vô ngã,
Ai thấu suốt được vậy,
Nhàm lìa mọi khổ đau."

Giải thích: Khi dùng trí tuệ để nhìn thấu rằng mọi sự vật trên đời đều biến đổi (vô thường), không có cái "Tôi" vĩnh cửu (vô ngã) và bám chấp vào chúng chỉ đem lại khổ não, con người sẽ tự nhiên sinh tâm nhàm chán những ham muốn phù du và hướng tâm về sự an lạc chân thật.

3. BÀI HỌC ỨNG DỤNG
- Thực hành Bát Chánh Đạo: Bắt đầu từ việc nói lời ái ngữ (Chánh ngữ) và làm việc thiện (Chánh nghiệp) mỗi ngày.
- Không ỷ lại: Luôn nhắc nhở mình rằng sự tiến bộ trên con đường tu học phụ thuộc hoàn toàn vào sự chuyên cần của chính mình.
- Quán chiếu vô thường: Mỗi khi gặp chuyện buồn hay quá vui, hãy nhắc mình: "Chuyện này rồi cũng sẽ qua", để giữ tâm quân bình.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã nạp thành công Kinh Pháp Cú Tập 20!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
</script>
</body>
</html>
