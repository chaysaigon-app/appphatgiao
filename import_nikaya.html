    const app = initializeApp(firebaseConfig);

    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 18: Phẩm Cấu Uế (Mala Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-018.jpg",
            content_full: `SỐ CÂU KỆ: 235 ĐẾN 255

1. GIỚI THIỆU SƠ LƯỢC
Phẩm Cấu Uế (Mala Vagga) dạy về những vết nhơ làm vẩn đục nhân cách và tâm hồn. Đức Phật chỉ ra rằng sự lười biếng, thiếu tỉnh giác và đặc biệt là sự si mê chính là những bụi bặm ngăn cản con người đạt đến sự thanh tịnh. Việc tu tập giống như một người thợ rèn kiên trì tẩy sạch rỉ sét trên miếng sắt.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 239: Tẩy sạch rỉ sét tâm hồn
"Từng sát na, từng tí,
Bậc trí tẩy uế mình,
Như thợ vàng lọc bụi,
Trong vàng ròng sáng choang."

Giải thích: Việc sửa mình không thể làm xong trong một sớm một chiều. Người có trí tuệ luôn quan sát tâm mình từng giây từng phút, gột rửa từng chút một những ý nghĩ xấu ác, giống như người thợ vàng tỉ mỉ lọc bỏ tạp chất để thu được vàng nguyên chất rực rỡ.

● Kệ số 242 & 243: Cấu uế lớn nhất
"Ác hạnh, uế đàn bà,
Xan tham, uế thí chủ,
Ác pháp là cấu uế,
Đời này và đời sau." (Kệ 242)

"Nhưng cấu uế hơn hết,
Vô minh, uế tối thượng,
Tẩy uế này, tỷ-kheo,
Thành bậc không cấu uế." (Kệ 243)

Giải thích: Có nhiều loại hành vi sai trái làm bẩn tâm hồn như tham lam, keo kiệt. Tuy nhiên, Đức Phật nhấn mạnh "Vô minh" (sự thiếu hiểu biết về sự thật) là vết nhơ nguy hiểm nhất, vì nó dẫn dắt con người vào vô vàn sai lầm khác. Chỉ khi có trí tuệ soi sáng, ta mới thực sự sạch bóng phiền não.

● Kệ số 252: Thấy lỗi người, quên lỗi mình
"Dễ thay thấy lỗi người,
Lỗi mình thấy mới khó,
Lỗi người, sảy như trấu,
Lỗi mình, giấu như bài."

Giải thích: Chúng ta thường rất tinh tường khi soi xét lỗi lầm của người khác nhưng lại mù quáng trước sai sót của chính mình. Người tu tập cần đảo ngược quá trình này: bao dung với lỗi của người và nghiêm khắc với lỗi của bản thân.

3. BÀI HỌC ỨNG DỤNG
- Kiên trì sửa mình: Đừng nản lòng khi thấy mình vẫn còn thói xấu, hãy bền bỉ lọc bỏ từng chút một mỗi ngày.
- Học hỏi Chánh pháp: Để xóa tan "Vô minh", hãy thường xuyên nghe kinh, học đạo để có trí tuệ dẫn đường.
- Tự soi rọi: Thay vì đi "sảy trấu" lỗi người, hãy dành thời gian để kiểm tra xem mình có đang "giấu bài" những sai lầm cá nhân hay không.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã nạp thành công Kinh Pháp Cú Tập 18!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
