</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
        messagingSenderId: "342500331725",
        appId: "1:342500331725:web:32795cf0146210f8019984"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 8: Phẩm Ngàn (Sahassa Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-008.jpg",
            content_full: `SỐ CÂU KỆ: 100 ĐẾN 115

1. GIỚI THIỆU SƠ LƯỢC
Phẩm Ngàn (Sahassa Vagga) là một trong những chương ấn tượng nhất của Kinh Pháp Cú. Thông qua những phép so sánh mạnh mẽ, Đức Phật khẳng định rằng giá trị của một lời nói, một ngày sống hay một chiến thắng không nằm ở số lượng hay quy mô, mà nằm ở chất lượng tỉnh thức và sự an lạc mà nó mang lại.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 100: Giá trị của lời nói
"Dù nói ngàn lời nói,
Vô ích, không nghĩa lý,
Tốt hơn một lời nghĩa,
Nghe xong, tâm bình yên."

Giải thích: Một bài diễn văn dài hàng ngàn chữ nhưng sáo rỗng, không giúp người nghe bớt khổ thì cũng chỉ là vô nghĩa. Ngược lại, chỉ cần một câu nói đúng pháp, đúng thời điểm mà giúp người nghe nhận ra chân lý và đạt được sự bình yên nội tâm thì câu nói đó quý giá hơn muôn ngàn lần.

● Kệ số 103: Chiến thắng vĩ đại nhất
"Dù tại bãi chiến trường,
Thắng hàng ngàn quân địch,
Tự thắng mình mới là,
Chiến công oanh liệt nhất."

Giải thích: Đánh bại kẻ thù bên ngoài dù lẫy lừng đến đâu cũng chỉ là những chiến thắng tạm thời và thường để lại oán thù. Chiến thắng vẻ vang và khó khăn nhất chính là chiến thắng được những thói hư tật xấu, những tham sân si của chính bản thân mình. Đó mới là bậc anh hùng thực sự.

● Kệ số 111: Một ngày sống có trí tuệ
"Dù sống đến trăm năm,
Ngu si, không thiền định,
Tốt hơn sống một ngày,
Có trí, tu thiền định."

Giải thích: Thời gian sống dài hay ngắn không quan trọng bằng việc ta sống như thế nào. Một trăm năm sống trong mê mờ, buông thả không giá trị bằng chỉ một ngày sống trong sự tỉnh thức, có trí tuệ và làm chủ được tâm trí mình thông qua việc tu tập.

3. BÀI HỌC ỨNG DỤNG
- Chú trọng chất lượng: Thay vì đọc quá nhiều mà không hiểu, hãy chọn một câu kinh và thực hành sâu sắc điều đó trong ngày.
- Quay lại sửa mình: Mỗi khi có mâu thuẫn, hãy tìm cách "thắng mình" bằng sự nhẫn nhịn và bao dung thay vì cố gắng thắng người khác.
- Trân trọng hiện tại: Sống trọn vẹn và tỉnh thức trong ngày hôm nay, vì một ngày sống ý nghĩa có giá trị hơn cả một đời sống trong vô minh.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã nạp thành công Kinh Pháp Cú Tập 8!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
</script>
