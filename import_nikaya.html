<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
        messagingSenderId: "342500331725",
        appId: "1:342500331725:web:32795cf0146210f8019984"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const batch1_struc = [
        { id: "MN-01", title_vi: "Kinh Pháp Môn Căn Bản", summary: "Dạy về cách liễu tri các pháp, không dục hỷ trong địa, thủy, hỏa, phong... để đoạn tận ái thủ." },
        { id: "MN-02", title_vi: "Kinh Tất Cả Lậu Hoặc", summary: "Hướng dẫn 7 phương pháp đoạn trừ phiền não: tri kiến, phòng hộ, thụ dụng, kham nhẫn, tránh né, trừ diệt, tu tập." },
        { id: "MN-03", title_vi: "Kinh Thừa Tự Pháp", summary: "Khuyên hành giả nên thừa tự Giáo pháp của Như Lai, không nên thừa tự tài vật thế gian." },
        { id: "MN-04", title_vi: "Kinh Sợ Hãi Khiếp Đảm", summary: "Kể về kinh nghiệm vượt qua nỗi sợ hãi nơi rừng sâu của Đức Phật khi còn là Bồ-tát." },
        { id: "MN-05", title_vi: "Kinh Không Uế Nhiễm", summary: "Phân tích về tâm có uế nhiễm và không uế nhiễm, tầm quan trọng của sự tự giác tỉnh sát." },
        { id: "MN-06", title_vi: "Kinh Ước Nguyện", summary: "Cách để thành tựu các ước nguyện cao thượng thông qua giữ giới và thiền định." },
        { id: "MN-07", title_vi: "Kinh Ví Dụ Tấm Vải", summary: "Tâm bị uế nhiễm như tấm vải bẩn; sau khi gột rửa sẽ trong sạch và dễ dàng chứng đắc." },
        { id: "MN-08", title_vi: "Kinh Đoạn Giảm", summary: "Dạy cách thực hành đoạn giảm các ác pháp thông qua việc đối lập bằng các thiện hạnh cụ thể." },
        { id: "MN-09", title_vi: "Kinh Chánh Tri Kiến", summary: "Giải thích chi tiết về Chánh tri kiến, Tứ Diệu Đế và 12 nhân duyên bởi Tôn giả Sariputta." },
        { id: "MN-10", title_vi: "Kinh Tứ Niệm Xứ", summary: "Con đường duy nhất dẫn đến Niết-bàn qua việc quán Thân, Thọ, Tâm, Pháp." }
    ];

    window.runImport = async () => {
        for (let item of batch1_struc) {
            await setDoc(doc(db, "Nikaya_Texts", item.id), {
                ...item,
                content_full: "Nội dung nguyên văn đang chờ cập nhật...",
                last_update: new Date()
            }, { merge: true });
            console.log("Đã tạo khung: " + item.id);
        }
        alert("Đã nạp xong cấu trúc 10 bài đầu!");
    };
</script>
<button onclick="runImport()">NẠP CẤU TRÚC 10 BÀI ĐẦU</button>
