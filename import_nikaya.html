<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nạp Bài Kinh Pháp Cú</title>
    <style>
        body { background: #000; color: #fff; font-family: Arial; padding: 50px; text-align: center; }
        .box { border: 2px solid #ccff00; padding: 30px; border-radius: 20px; display: inline-block; }
        button { padding: 15px 30px; background: #ccff00; border: none; font-weight: bold; cursor: pointer; border-radius: 10px; font-size: 20px; }
    </style>
</head>
<body>

<div class="box">
    <h2>Nạp Bài: Pháp Cú - Tập 1: Phẩm Song Yếu</h2>
    <p>Nhấn nút bên dưới để đưa dữ liệu vào hệ thống</p>
    <button id="uploadBtn">BẮT ĐẦU NẠP DỮ LIỆU</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Cấu hình Firebase của bạn
    const firebaseConfig = {
        apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
        messagingSenderId: "342500331725",
        appId: "1:342500331725:web:32795cf0146210f8019984"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Pháp Cú - Tập 1: Phẩm Song Yếu (Yamaka Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-001.jpg", // Bạn có thể thay link ảnh này
            content_full: `SỐ CÂU KỆ: 01 ĐẾN 20

1. GIỚI THIỆU SƠ LƯỢC
"Song Yếu" có nghĩa là các cặp đối lập. Trong phẩm này, Đức Phật đưa ra các khái niệm ngược chiều nhau (Thiện - Ác, Khổ - Vui, Ghét - Thương) để giúp chúng ta nhận diện rõ quy luật nhân quả đang vận hành trong từng ý nghĩ và hành động hằng ngày.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Cặp Kệ số 1 & 2: Sức mạnh của Ý dẫn đầu
"Tâm dẫn đầu các pháp,
Tâm làm chủ, tâm tạo;
Nếu nói hay hành động,
Với tâm ý ô nhiễm,
Khổ não bước theo sau,
Như bánh xe vật kéo." (Kệ số 1)

"Tâm dẫn đầu các pháp,
Tâm làm chủ, tâm tạo;
Nếu nói hay hành động,
Với tâm ý thanh tịnh,
Hạnh phúc bước theo sau,
Như bóng không rời hình." (Kệ số 2)

Giải thích: Mọi việc bạn làm hay lời bạn nói đều bắt nguồn từ suy nghĩ. Nếu tâm bạn chứa đựng sự ích kỷ hay giận dữ, nỗi khổ sẽ bám theo bạn như vết bánh xe lún sâu trên đường. Ngược lại, nếu lòng bạn bình an và tử tế, niềm vui sẽ tự nhiên đi theo bạn như cái bóng.

● Cặp Kệ số 3, 4 & 5: Hóa giải thù hận
"Với hận diệt hận thù,
Đời này không có được.
Không hận diệt hận thù,
Là định luật ngàn thu." (Kệ số 5)

Giải thích: Dùng sự giận dữ để đáp trả giận dữ chỉ làm oán thù thêm sâu nặng. Chỉ có sự buông bỏ và lòng bao dung mới có thể chấm dứt hận thù một cách triệt để.

● Cặp Kệ số 19 & 20: Học đi đôi với Hành
"Dù tụng nhiều kinh điển,
Không hành trì buông lung,
Như kẻ chăn bò mướn,
Đếm bò cho người khác." (Kệ số 19)

Giải thích: Nếu bạn đọc triết lý nhiều nhưng không thay đổi thói quen xấu, kiến thức đó không giúp ích gì cho bạn.

3. BÀI HỌC ỨNG DỤNG
- Chăm sóc tâm trí: Quan sát tâm mình đang "đục" hay "trong" trước khi hành động.
- Dừng phán xét: Giảm việc nhắc lỗi người khác.
- Thực hành ngay: Áp dụng ngay một điều tốt nhỏ vào cuộc sống.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Nạp bài Pháp Cú thành công!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
</script>
</body>
</html>
