    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 10: Phẩm Hình Phạt (Danda Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-010.jpg",
            content_full: `SỐ CÂU KỆ: 129 ĐẾN 145

1. GIỚI THIỆU SƠ LƯỢC
Phẩm Hình Phạt (Danda Vagga) dạy về lòng từ bi thông qua sự đồng cảm. Đức Phật nhắc nhở rằng mọi chúng sinh đều sợ hãi hình phạt và quý trọng sự sống. Khi ta nhận ra nỗi đau của người khác cũng giống như nỗi đau của chính mình, ta sẽ không bao giờ nhẫn tâm làm hại ai.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 129 & 130: Lấy mình suy người
"Mọi người sợ hình phạt,
Mọi người sợ tử vong,
Lấy mình làm ví dụ,
Không giết, không bảo giết." (Kệ 129)

"Mọi người sợ hình phạt,
Mọi người thương sống còn,
Lấy mình làm ví dụ,
Không giết, không bảo giết." (Kệ 130)

Giải thích: Ai cũng run rẩy trước đòn roi và cái chết. Ai cũng tha thiết muốn được sống an ổn. Nếu bạn biết mình đau đớn thế nào khi bị tổn thương, hãy dùng chính cảm giác đó để thấu hiểu cho người khác và các loài vật. Đừng trực tiếp gây hại, cũng đừng xúi giục ai làm điều ác.

● Kệ số 131 & 132: Tìm cầu hạnh phúc sai cách
"Ai tìm cầu hạnh phúc,
Dùng trượng hại chúng sinh,
Người cũng cầu hạnh phúc,
Đời sau không hạnh phúc." (Kệ 131)

Giải thích: Nếu bạn cố gắng xây dựng niềm vui cho mình trên sự đau khổ của người khác hoặc bằng cách áp bức kẻ yếu, thì kết quả bạn nhận được chỉ là sự bất an. Hạnh phúc chân thật không bao giờ có thể nảy mầm từ mảnh đất của sự bạo lực.

● Kệ số 133: Lời nói và sự phản kháng
"Chớ nói lời ác độc,
Nói ác, bị nói lại,
Khổ thay, lời tranh cãi,
Hình phạt sẽ đến nơi."

Giải thích: Những lời nói thô bạo, cay nghiệt giống như những mũi tên bắn đi nhưng sẽ quay ngược trở lại phía mình. Khi ta dùng lời ác để công kích người khác, ta đang tự tạo ra một môi trường đầy xung đột và sớm muộn gì cũng phải gánh chịu hậu quả từ sự phản kháng đó.

3. BÀI HỌC ỨNG DỤNG
- Thực hành lòng trắc ẩn: Luôn đặt mình vào vị trí của người khác trước khi đưa ra một quyết định có thể gây ảnh hưởng đến họ.
- Ái ngữ trong giao tiếp: Sử dụng lời nói nhẹ nhàng, xây dựng thay vì dùng ngôn từ gây tổn thương.
- Bảo vệ sự sống: Tôn trọng mạng sống của mọi chúng sinh, từ con người đến những loài vật nhỏ nhất.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã nạp thành công Kinh Pháp Cú Tập 10!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
