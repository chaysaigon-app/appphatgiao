</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
        messagingSenderId: "342500331725",
        appId: "1:342500331725:web:32795cf0146210f8019984"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 22: Phẩm Địa Ngục (Niraya Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-022.jpg",
            content_full: `SỐ CÂU KỆ: 306 ĐẾN 319

1. GIỚI THIỆU SƠ LƯỢC
Phẩm Địa Ngục (Niraya Vagga) không chỉ nói về cảnh giới đau khổ sau cái chết, mà chủ yếu nhấn mạnh vào trạng thái tâm lý đen tối của những người sống giả dối, làm ác mà chối bỏ, hoặc vi phạm các quy tắc đạo đức. Đức Phật dạy rằng bóng tối của ác nghiệp sẽ dẫn dắt con người đến những nơi sầu muộn, dù họ có cố gắng che giấu đến đâu.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 306: Quả báo của sự giả dối
"Nói láo, đọa địa ngục,
Làm rồi, nói không làm,
Cả hai, sau khi chết,
Đều chịu khổ như nhau."

Giải thích: Sự dối trá là một vết nhơ nặng nề cho tâm hồn. Người cố ý nói sai sự thật để trục lợi hoặc làm ác rồi chối bỏ trách nhiệm đều tự tạo ra một cảnh giới nội tâm đầy sợ hãi và bất an. Sự trốn tránh sự thật chính là con đường dẫn đến khổ đau dài hạn.

● Kệ số 311 & 312: Sự nguy hại của việc tu tập sai lạc
"Như cỏ sắc cầm sai,
Làm đứt tay người cầm,
Sa-môn hạnh sai lạc,
Dẫn đến nẻo ác thôi." (Kệ 311)

Giải thích: Việc tu tập hay giữ giới nếu không được thực hiện với sự chân thành và hiểu biết thì cũng giống như cầm một nhành cỏ sắc cạnh không đúng cách, nó sẽ làm tổn thương chính người cầm. Hình thức bên ngoài không thay thế được sự tu tập thực chất từ bên trong.

● Kệ số 316 & 317: Sự điên đảo của tâm thức
"Không đáng hổ, lại hổ,
Đáng hổ, lại không hổ,
Ôm giữ các tà kiến,
Chúng sinh đọa nẻo ác."

Giải thích: Nhiều người thường xấu hổ vì những chuyện không đáng (như sự nghèo khó, giản dị) nhưng lại thản nhiên làm những việc đáng hổ thẹn (như lừa dối, hại người). Sự đảo lộn giá trị đạo đức này khiến tâm trí mù mịt và xa rời con đường chân chính.

3. BÀI HỌC ỨNG DỤNG
- Sống chân thật: Tập thói quen nói thật và chịu trách nhiệm về mọi hành động của mình để giữ cho tâm hồn luôn sáng sủa, nhẹ nhàng.
- Chú trọng thực chất: Đừng quá quan tâm đến vẻ hào nhoáng hay hình thức bên ngoài, hãy tập trung vào sự tử tế thật sự trong lòng.
- Minh định đúng sai: Luôn dùng Chánh pháp làm gương soi để biết rõ điều gì thực sự đáng hổ thẹn và điều gì đáng tự hào, không chạy theo những giá trị sai lệch của đám đông.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã nạp thành công Kinh Pháp Cú Tập 22!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
</script>
