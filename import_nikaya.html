    const app = initializeApp(firebaseConfig);

    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 14: Phẩm Phật Đà (Buddha Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-014.jpg",
            content_full: `SỐ CÂU KỆ: 179 ĐẾN 196

1. GIỚI THIỆU SƠ LƯỢC
Phẩm Phật Đà (Buddha Vagga) khắc họa chân dung của bậc Giác Ngộ hoàn toàn. Đức Phật dạy rằng dấu chân của một bậc Đạo Sư không để lại dấu vết của tham ái, sân hận. Đồng thời, Ngài đưa ra những lời dạy cốt lõi về việc làm thiện, lánh ác và giữ tâm trong sạch để mọi người cùng thực hành.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 183: Tóm tắt giáo pháp
"Không làm mọi hạnh ác,
Thành tựu các hạnh lành,
Tâm ý giữ trong sạch,
Chính lời chư Phật dạy."

Giải thích: Đây là tôn chỉ ngắn gọn nhất của đạo Phật. Tu tập không phải là làm điều gì cao siêu mà bắt đầu từ việc dừng lại các việc xấu, nỗ lực làm các việc tốt và quan trọng nhất là thanh lọc tâm trí khỏi những cấu uế của bản ngã.

● Kệ số 188 & 189: Chỗ ẩn náu an toàn
"Người sợ hãi tìm cầu,
Ẩn náu núi rừng xa,
Vườn cây hay tháp miếu,
Chỗ ấy chẳng an toàn." (Kệ 188)

"Chỗ ẩn náu như vậy,
Không thoát mọi khổ đau;
Ai quy ngưỡng Tam Bảo,
Mới thoát mọi khổ sầu." (Kệ 189)

Giải thích: Khi gặp nghịch cảnh hay sợ hãi, con người thường tìm đến thần linh hay những nơi ẩn dật bên ngoài. Nhưng những nơi đó không thể xóa tan nỗi khổ trong tâm. Chỉ khi ta nương tựa vào Phật (Trí tuệ), Pháp (Chân lý) và Tăng (Đoàn thể thanh tịnh), ta mới thực sự tìm thấy con đường thoát khổ bền vững.

● Kệ số 194: Niềm vui tối thượng
"Vui thay, Phật ra đời,
Vui thay, Pháp được giảng,
Vui thay, Tăng hòa hợp,
Hòa hợp tu, vui thay!"

Giải thích: Sự xuất hiện của một vị Phật và Chánh pháp là phước báu lớn cho thế gian. Niềm vui thực sự đến từ sự hòa thuận trong tập thể và sự đồng lòng tu tập của những người bạn đạo trên con đường tìm kiếm sự thật.

3. BÀI HỌC ỨNG DỤNG
- Đơn giản hóa việc tu tập: Mỗi ngày tự hỏi mình: "Hôm nay mình đã bớt ác, thêm thiện và giữ tâm trong sạch chưa?".
- Tìm đúng nơi nương tựa: Khi gặp khó khăn, hãy dùng trí tuệ để quan sát thay vì mê tín hay tìm cách chạy trốn.
- Trân trọng sự hòa hợp: Nuôi dưỡng tinh thần đoàn kết và yêu thương với những người xung quanh để tạo ra môi trường sống an lạc.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã nạp thành công Kinh Pháp Cú Tập 14!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
