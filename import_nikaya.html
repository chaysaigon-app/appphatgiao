<script type="module">

        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",

        appId: "1:342500331725:web:32795cf0146210f8019984"

    const app = initializeApp(firebaseConfig);

    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 17: Phẩm Phẫn Nộ (Kodha Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-017.jpg",
            content_full: `SỐ CÂU KỆ: 221 ĐẾN 234

1. GIỚI THIỆU SƠ LƯỢC
Phẩm Phẫn Nộ (Kodha Vagga) cảnh báo về sự nguy hại của cơn giận dữ — ngọn lửa có thể thiêu rụi mọi công đức. Đức Phật dạy rằng người thực sự mạnh mẽ không phải là người đánh bại người khác bằng bạo lực, mà là người có khả năng chế ngự cơn giận đang trào dâng trong lòng mình.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 222: Người đánh xe giỏi
"Ai ngăn được phẫn nộ,
Như dừng xe đang lăn,
Ta gọi: 'Người đánh xe',
Kẻ khác: 'Kẻ cầm dây'."

Giải thích: Chế ngự cơn giận khi nó đang bùng phát cũng khó như việc dừng một chiếc xe đang lao dốc. Những người chỉ biết kìm nén bằng hình thức bên ngoài thì chỉ như người cầm dây cương, còn người thực sự làm chủ được nội tâm mới xứng đáng gọi là "Người đánh xe" tài ba.

● Kệ số 223: Lấy thiện thắng ác
"Lấy không giận thắng giận,
Lấy thiện thắng không thiện,
Lấy thí thắng xan tham,
Lấy chân thắng hư ngụy."

Giải thích: Đây là phương pháp chuyển hóa tâm thức tối thượng. Đừng dùng sự giận dữ để đáp trả giận dữ vì điều đó chỉ làm oan trái thêm sâu. Hãy dùng lòng từ bi, sự tử tế và lòng chân thành để hóa giải mọi xung đột và sai lầm.

● Kệ số 227: Miệng thế gian khen chê
"A-tu-la nên biết,
Đời xưa và đời nay,
Ngồi yên bị người chê,
Nói nhiều bị người chê,
Nói ít bị người chê,
Làm người không bị chê,
Thế gian không có được."

Giải thích: Đức Phật nhắc nhở rằng khen chê là chuyện bình thường của thế gian. Dù bạn làm gì hay im lặng, vẫn sẽ có người không hài lòng. Hiểu được điều này giúp ta bớt sân hận và giữ được tâm thái bình thản trước dư luận.

3. BÀI HỌC ỨNG DỤNG
- Nhận diện cơn giận: Khi thấy nóng nảy, hãy quan sát hơi thở và nhắc mình: "Dừng lại như xe đang lăn".
- Thực hành đối trị: Khi gặp người ác, hãy nỗ lực khởi tâm thiện; gặp người giả dối, hãy kiên trì sống chân thật.
- Bảo vệ lời nói và hành động: Giữ gìn sự điềm tĩnh trong mọi tình huống để không gây ra những hậu quả đáng tiếc khi đang mất bình tĩnh.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã nạp thành công Kinh Pháp Cú Tập 17!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
</script>
