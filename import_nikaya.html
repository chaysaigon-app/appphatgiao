    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 23: Phẩm Voi (Nāga Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-023.jpg",
            content_full: `SỐ CÂU KỆ: 320 ĐẾN 333

1. GIỚI THIỆU SƠ LƯỢC
Phẩm Voi (Nāga Vagga) mượn hình ảnh loài voi dũng mãnh, kiên trì trên chiến trường để dạy về đức nhẫn nhục. Đức Phật dạy rằng người tu tập cần phải như con voi chiến, chịu đựng được mọi mũi tên của sự chỉ trích, phỉ báng từ người đời mà vẫn không lay chuyển tâm chí thiện lành.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 320: Nhẫn nhục trước phỉ báng
"Ta như voi giữa trận,
Hứng chịu cung tên rơi,
Chịu đựng mọi phỉ báng,
Người đời thường ác tâm."

Giải thích: Sống giữa cuộc đời, việc gặp phải những lời nói khó nghe, những sự hiểu lầm hay chỉ trích là điều không thể tránh khỏi. Hãy rèn luyện nội lực dẻo dai như con voi dũng cảm, coi những lời phỉ báng chỉ là những mũi tên bắn vào giáp sắt, không thể làm tổn thương đến sự bình an bên trong.

● Kệ số 322: Tự điều phục mới là tối thượng
"Ngựa tốt, voi quý báu,
Đều cần phải huấn luyện,
Nhưng tự điều thân tâm,
Mới thật là tối thượng."

Giải thích: Những loài vật quý hiếm dù có được huấn luyện giỏi đến đâu cũng chỉ phục vụ cho những mục đích tạm thời. Việc huấn luyện và làm chủ chính thân tâm mình — rèn luyện sự bình tĩnh, sáng suốt và đạo đức — mới mang lại giá trị vĩnh cửu và sự giải thoát thật sự.

● Kệ số 330: Độc hành nhưng an lạc
"Nếu không gặp bạn lành,
Đồng hành, sống hiền trí,
Hãy sống một mình thôi,
Như voi rừng tự tại."

Giải thích: Trong tu tập, việc có một người bạn tốt đồng hành là rất quý. Tuy nhiên, nếu không tìm được người có cùng chí hướng thiện lành, thà rằng ta chọn sống một mình để bảo vệ tâm trí, còn hơn là đi cùng những người kéo mình xuống hố sâu của tham đắm và sân hận.

3. BÀI HỌC ỨNG DỤNG
- Luyện tâm "giáp sắt": Đừng để những lời nói tiêu cực của người khác quyết định tâm trạng của bạn. Hãy nhẫn nhục và điềm tĩnh.
- Tập trung tự huấn luyện: Mỗi ngày dành thời gian quan sát và sửa đổi chính mình thay vì cố gắng thay đổi người khác.
- Chọn lọc các mối quan hệ: Hãy trân trọng những người bạn giúp ta tiến bộ, và đủ dũng cảm để độc hành nếu môi trường xung quanh không phù hợp với con đường đạo đức.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã nạp thành công Kinh Pháp Cú Tập 23!");
        } catch (e) {

        }
    };
