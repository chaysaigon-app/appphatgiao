    <button id="uploadBtn">XÁC NHẬN NẠP DỮ LIỆU</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
        messagingSenderId: "342500331725",
        appId: "1:342500331725:web:32795cf0146210f8019984"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 7: Phẩm A-La-Hán (Aranhanta Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-007.jpg",
            content_full: `SỐ CÂU KỆ: 90 ĐẾN 99

1. GIỚI THIỆU SƠ LƯỢC
Phẩm A-La-Hán mô tả phong thái và nội tâm của những bậc đã đạt đến sự giải thoát hoàn toàn, không còn bị ràng buộc bởi các lậu hoặc (phiền não). Một bậc A-La-Hán sống giữa cuộc đời nhưng tâm trí luôn tự tại, không còn lo âu, sợ hãi hay bám chấp vào bất cứ điều gì.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 90: Kết thúc cuộc hành trình
"Đích đến đã đạt được,
Không sầu, thoát tất cả,
Mọi thắt buộc mở tung,
Nhiệt não không còn nữa."

Giải thích: Một người khi đã đạt tới mục tiêu cuối cùng của sự tu tập thì nỗi khổ niềm đau sẽ chấm dứt. Giống như một người lữ hành đã về đến nhà, mọi gánh nặng và sự lo âu trên đường đi đều được buông xuống, tâm hồn trở nên mát mẻ và bình yên tuyệt đối.

● Kệ số 92: Dấu chân của sự tự tại
"Ai không có tích trữ,
Ăn uống biết điều độ,
Tự tại trong Không, Vô,
Dấu chân khó tìm được."

Giải thích: Bậc A-La-Hán sống giản đơn, không ham cầu tích trữ vật chất và luôn chừng mực trong việc ăn uống. Tâm các Ngài an trú trong sự thanh tịnh, không bị vướng mắc bởi cái "Tôi". Hành tung và tâm ý của các Ngài tự do như chim bay giữa trời cao, không để lại dấu vết của sự tham đắm.

● Kệ số 97: Người tối thượng
"Không tin, hiểu Vô vi,
Cắt đứt mọi thắt buộc,
Dứt tận mọi cơ hội,
Bậc tối thượng là đây."

Giải thích: Chữ "Không tin" ở đây có nghĩa là không còn tin dựa vào những kiến thức mơ hồ hay niềm tin mù quáng, mà là tự mình thấu triệt sự thật (Vô vi). Khi đã cắt đứt mọi sợi dây ràng buộc của ham muốn và không còn tạo ra nhân duyên cho khổ đau khởi phát, đó chính là bậc vĩ đại nhất.

3. BÀI HỌC ỨNG DỤNG
- Học cách buông bỏ: Tập buông dần những sự bám chấp quá mức vào vật chất hay danh tiếng để tâm bớt nặng nề.
- Sống tỉnh thức và giản đơn: Chú trọng vào phẩm chất nội tâm hơn là sự hưởng thụ bề ngoài.
- Kiên trì mục tiêu: Coi sự an lạc nội tâm là đích đến cao nhất để không bị lạc lối giữa những cám dỗ đời thường.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã nạp thành công Kinh Pháp Cú Tập 7!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
</script>
