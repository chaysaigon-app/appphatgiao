    <p>Nội dung chi tiết Kinh gốc về Phong thái người tu hành</p>
    <button id="uploadBtn">XÁC NHẬN NẠP DỮ LIỆU</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
        messagingSenderId: "342500331725",
        appId: "1:342500331725:web:32795cf0146210f8019984"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 25: Phẩm Tỷ-kheo (Bhikkhu Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-025.jpg",
            content_full: `SỐ CÂU KỆ: 360 ĐẾN 382

1. GIỚI THIỆU SƠ LƯỢC
Phẩm Tỷ-kheo (Bhikkhu Vagga) khắc họa chân dung một người tu hành lý tưởng. Một vị Tỷ-kheo thực thụ không chỉ nằm ở hình thức bên ngoài mà nằm ở khả năng thu thúc lục căn, sống giản đơn, tri túc và luôn giữ tâm tĩnh lặng giữa những biến động của cuộc đời.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 360 & 361: Thu thúc lục căn
"Lành thay, chế ngự mắt,
Lành thay, chế ngự tai,
Mũi, lưỡi và thân, ý,
Giải thoát mọi khổ đau."

Giải thích: Khổ đau thường đến từ việc chúng ta để mắt mải mê nhìn cái đẹp, tai mải nghe lời nịnh hót, hay tâm ý chạy theo những tham muốn. Một người tu tập biết dừng lại đúng lúc, không để các giác quan lôi kéo mình vào vòng xoáy của dục vọng sẽ tìm thấy sự tự do thực sự.

● Kệ số 362: Định nghĩa về người tu hành
"Tay, chân khéo chế ngự,
Lời nói khéo giữ gìn,
Vui thích trong thiền định,
Xứng gọi vị Tỷ-kheo."

Giải thích: Một người xứng danh tu hành phải làm chủ được mọi hành động của thân thể và lời nói của mình. Thay vì tìm niềm vui trong sự ồn ào của thế gian, họ tìm thấy hạnh phúc sâu sắc trong sự tĩnh lặng của thiền định và nội tâm an lạc.

● Kệ số 369: Tát cạn thuyền tâm
"Tát cạn thuyền này, tỷ-kheo,
Tát cạn, thuyền đi nhẹ,
Dứt tận tham và sân,
Đạt đến Niết-bàn thôi."

Giải thích: Đức Phật ví tâm hồn giống như một con thuyền. Nếu thuyền đầy nước (tham lam và sân hận), nó sẽ nặng nề và dễ đắm. Hãy kiên trì "tát cạn" những phiền não đó đi, con thuyền tâm của bạn sẽ trở nên nhẹ nhàng và lướt đi nhanh chóng tới bến bờ bình an.

3. BÀI HỌC ỨNG DỤNG
- Làm chủ giác quan: Tập thói quen quan sát phản ứng của mình khi nghe một lời chê hay nhìn một món đồ đẹp để không bị chúng dẫn dắt.
- Sống đơn giản: Hài lòng với những gì mình đang có, giảm bớt những nhu cầu không cần thiết để tâm trí được nhẹ nhàng.
- Dành thời gian tĩnh lặng: Mỗi ngày dành ra một khoảng thời gian yên tĩnh để "tát cạn" những lo âu, mệt mỏi trong tâm trí.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã nạp thành công Kinh Pháp Cú Tập 25!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
</script>
