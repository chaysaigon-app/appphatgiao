    const app = initializeApp(firebaseConfig);

    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 26: Phẩm Bà-la-môn (Brāhmaṇa Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-026.jpg",
            content_full: `SỐ CÂU KỆ: 383 ĐẾN 423

1. GIỚI THIỆU SƠ LƯỢC
Phẩm Bà-la-môn (Brāhmaṇa Vagga) là chương kết thúc của Kinh Pháp Cú. Ở đây, Đức Phật dùng từ "Bà-la-môn" để chỉ những bậc lậu tận, những người đã hoàn toàn giải thoát. Ngài khẳng định giá trị con người nằm ở hành động và nội tâm, chứ không phải ở hình thức hay xuất thân.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 383: Nỗ lực vượt dòng sông dục vọng
"Hãy nỗ lực cắt dòng,
Này vị Bà-la-môn,
Dục vọng hãy buông bỏ,
Thấu suốt pháp Vô vi."

Giải thích: Muốn đạt đến sự giải thoát, ta phải dũng cảm lội ngược dòng nước của những ham muốn thông thường. Khi đã thấu hiểu được bản chất không sinh không diệt của vạn vật (Vô vi), mọi sự bám chấp sẽ tự tan biến.

● Kệ số 391: Thanh tịnh ba nghiệp
"Thân, khẩu và ý niệm,
Không làm việc ác sai,
Giữ gìn cả ba chỗ,
Ta gọi: Bà-la-môn."

Giải thích: Một bậc Thánh nhân thực thụ là người làm chủ hoàn toàn hành động (thân), lời nói (khẩu) và suy nghĩ (ý). Khi cả ba phương diện này đều hướng về sự thiện lành và thanh tịnh, người đó đã đạt tới phẩm hạnh cao quý nhất.

● Kệ số 413: Mặt trăng không tì vết
"Như mặt trăng không uế,
Trong sáng và tĩnh lặng,
Diệt tận mọi hỷ ái,
Ta gọi: Bà-la-môn."

Giải thích: Tâm hồn của một người giác ngộ giống như vầng trăng rằm rạng rỡ, không bị mây mù của tham sân si che khuất. Sự tĩnh lặng và sáng suốt đó đến từ việc từ bỏ mọi sự ham cầu ích kỷ đối với thế gian.

3. BÀI HỌC TỔNG KẾT KINH PHÁP CÚ
- Giá trị nội tại: Đừng đánh giá mình hay người khác qua vẻ ngoài, hãy nhìn vào đạo đức và sự tự chủ của tâm hồn.
- Kiên trì tu tập: Việc sửa mình là một quá trình liên tục từ Phẩm Song Yếu (Tập 1) cho đến Phẩm Bà-la-môn (Tập 26).
- Hướng tới sự an lạc: Mục tiêu cuối cùng của mọi lời dạy trong Pháp Cú là giúp chúng ta có một cuộc sống bình yên, tự tại và không còn khổ đau.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Chúc mừng! Bạn đã hoàn tất nạp 26 tập Kinh Pháp Cú!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
</script>
