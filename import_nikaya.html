<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nạp Nhiều Tập Pháp Cú - Kinh Gốc</title>
    <style>
        body { background: #000; color: #fff; font-family: Arial; padding: 50px; text-align: center; }
        .box { border: 2px solid #ccff00; padding: 30px; border-radius: 20px; display: inline-block; }
        button { padding: 15px 40px; background: #ccff00; border: none; font-weight: bold; cursor: pointer; border-radius: 10px; font-size: 20px; text-transform: uppercase; }
        #status { margin-top: 20px; color: #ccff00; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2 style="color: #ccff00;">NẠP CHÙM BÀI: PHÁP CÚ TẬP 3, 4 & 5</h2>
    <p>Hệ thống sẽ tự động nạp 3 tập này vào mục Kinh Gốc</p>
    <button id="uploadBtn">BẮT ĐẦU NẠP TẤT CẢ</button>
    <div id="status"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
        messagingSenderId: "342500331725",
        appId: "1:342500331725:web:32795cf0146210f8019984"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const danhSachBai = [
        {
            title: "Pháp Cú - Tập 3: Phẩm Tâm (Citta Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-003.jpg",
            content_full: "SỐ CÂU KỆ: 33 ĐẾN 43\n\n1. GIỚI THIỆU: Tâm vốn dao động, khó nắm giữ. Phẩm này dạy cách uốn nắn và làm chủ tâm trí.\n\n2. KỆ NGÔN: 'Tâm hoảng hốt, dao động / Khó hộ trì, khó nhiếp / Người trí uốn tâm thẳng / Như thợ tên uốn tên.' (Kệ 33)\n\n3. GIẢI THÍCH: Tâm giống như con cá bị quăng lên cạn, luôn vùng vẫy. Ai làm chủ được tâm, người đó có hạnh phúc.",
            hidden: false,
            createdAt: new Date()
        },
        {
            title: "Pháp Cú - Tập 4: Phẩm Hoa (Puppha Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-004.jpg",
            content_full: "SỐ CÂU KỆ: 44 ĐẾN 59\n\n1. GIỚI THIỆU: Dùng hình ảnh hoa để nói về sự vô thường và hương thơm đức hạnh.\n\n2. KỆ NGÔN: 'Hương các loại hoa thơm / Không bay ngược chiều gió / Nhưng hương người đức hạnh / Bay khắp mọi phương trời.' (Kệ 54)\n\n3. GIẢI THÍCH: Hoa đẹp rồi sẽ tàn, nhưng lòng tốt của con người thì để lại tiếng thơm mãi mãi.",
            hidden: false,
            createdAt: new Date()
        },
        {
            title: "Pháp Cú - Tập 5: Phẩm Ngu (Bala Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-005.jpg",
            content_full: "SỐ CÂU KỆ: 60 ĐẾN 75\n\n1. GIỚI THIỆU: Nhận diện những sai lầm của người thiếu trí tuệ.\n\n2. KỆ NGÔN: 'Đêm dài cho kẻ thức / Đường dài cho kẻ mệt / Luân hồi dài cho kẻ / Không biết chân diệu pháp.' (Kệ 60)\n\n3. GIẢI THÍCH: Người ngu tự coi mình là trí mới thật là ngu. Người ngu làm ác sẽ chịu khổ như muỗng múc canh mà không biết vị của canh.",
            hidden: false,
            createdAt: new Date()
        }
    ];

    document.getElementById('uploadBtn').onclick = async () => {
        const status = document.getElementById('status');
        status.innerText = "Đang nạp dữ liệu... vui lòng chờ.";
        
        try {
            for (const bai of danhSachBai) {
                await addDoc(collection(db, "Nikaya_Texts"), bai);
            }
            status.innerText = "CHÚC MỪNG! ĐÃ NẠP XONG 3 TẬP (3, 4, 5).";
            alert("Đã hoàn tất nạp chùm bài!");
        } catch (e) {
            status.innerText = "Lỗi: " + e.message;
        }
    };
</script>
</body>
</html>
