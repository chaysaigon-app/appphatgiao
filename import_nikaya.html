<script type="module">

        apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
        messagingSenderId: "342500331725",
        appId: "1:342500331725:web:32795cf0146210f8019984"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 21: Phẩm Tạp Lục (Pakiṇṇaka Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-021.jpg",
            content_full: `SỐ CÂU KỆ: 290 ĐẾN 305

1. GIỚI THIỆU SƠ LƯỢC
Phẩm Tạp Lục (Pakiṇṇaka Vagga) gồm nhiều bài kệ dạy về những khía cạnh khác nhau trong đời sống tu tập. Điểm nổi bật là lời nhắc nhở về việc từ bỏ những hạnh phúc nhỏ nhen, tạm bợ để hướng tới niềm an lạc to lớn, vững bền. Phẩm này cũng nhấn mạnh đến sự tỉnh giác thường trực trong mọi tư thế: đi, đứng, nằm, ngồi.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 290: Đánh đổi để thành công
"Nhờ bỏ lạc nhỏ nhen,
Thấy được lạc to lớn,
Bậc trí bỏ lạc nhỏ,
Hướng đến lạc to lớn."

Giải thích: Giống như một người muốn có sức khỏe thì phải bỏ đi thói quen ăn uống vô độ, người tu tập muốn có sự an lạc sâu sắc thì phải biết từ bỏ những thú vui phù du, ích kỷ hằng ngày. Sự hy sinh những ham muốn nhất thời là cái giá xứng đáng để đổi lấy sự bình an vĩnh cửu.

● Kệ số 294 & 295: Diệt tận gốc rễ khổ đau
"Diệt mẹ (ái), cha (mạn),
Hai vua (thường, đoạn kiến),
Diệt nước và bầy tôi,
La-hán, không ưu sầu."

Giải thích: Đây là những hình ảnh ẩn dụ mạnh mẽ. "Mẹ" tượng trưng cho lòng ham muốn (ái), "Cha" tượng trưng cho sự ngã mạn. Khi một người bằng trí tuệ có thể tiêu diệt tận gốc rễ của những mầm mống gây khổ đau này, họ sẽ trở thành bậc tự tại, không còn bất cứ nỗi lo âu hay sầu muộn nào bám đuổi.

● Kệ số 296 đến 301: Chánh niệm tỉnh giác hằng ngày
"Đệ tử Gotama,
Luôn tự thân tỉnh giác,
Ngày đêm thường tưởng nhớ,
Công đức của Phật, Pháp, Tăng."

Giải thích: Đức Phật khuyên các đệ tử hãy luôn giữ tâm trí tỉnh táo. Dù làm việc gì, dù ngày hay đêm, hãy luôn hướng tâm về những giá trị cao quý của Tam Bảo và thực hành lòng từ bi. Sự tỉnh giác này chính là "hàng rào" bảo vệ tâm hồn khỏi những tác động tiêu cực của thế gian.

3. BÀI HỌC ỨNG DỤNG
- Biết lựa chọn ưu tiên: Tập thói quen tự hỏi: "Thú vui này có giúp mình bình an lâu dài không?" trước khi thực hiện.
- Thực hành Chánh niệm: Tập trung hoàn toàn vào việc mình đang làm trong hiện tại, thay vì để tâm trí chạy theo những ảo tưởng.
- Nuôi dưỡng đức tin: Thường xuyên nhắc nhở mình về những tấm gương đức hạnh để có thêm động lực trên con đường tu sửa bản thân.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã nạp thành công Kinh Pháp Cú Tập 21!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
</script>
