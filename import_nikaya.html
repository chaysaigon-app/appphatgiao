<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nạp Pháp Cú Tập 2 - Kinh Gốc</title>
    <style>
        body { background: #000; color: #fff; font-family: Arial; padding: 50px; text-align: center; }
        .box { border: 2px solid #ccff00; padding: 30px; border-radius: 20px; display: inline-block; }
        button { padding: 15px 30px; background: #ccff00; border: none; font-weight: bold; cursor: pointer; border-radius: 10px; font-size: 20px; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="box">
    <h2 style="color: #ccff00;">NẠP BÀI: PHÁP CÚ - TẬP 2: PHẨM KHÔNG PHÓNG DẬT</h2>
    <p>Nhấn nút để đưa bài học vào mục Kinh Gốc</p>
    <button id="uploadBtn">XÁC NHẬN NẠP DỮ LIỆU</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
        messagingSenderId: "342500331725",
        appId: "1:342500331725:web:32795cf0146210f8019984"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Pháp Cú - Tập 2: Phẩm Không Phóng Dật (Appamada Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-002.jpg",
            content_full: `SỐ CÂU KỆ: 21 ĐẾN 32

1. GIỚI THIỆU SƠ LƯỢC
"Không Phóng Dật" (Appamada) nghĩa là sự tỉnh giác, không buông lung, luôn cẩn trọng trong từng ý nghĩ và hành động. Đây là chìa khóa để mở cánh cửa bất tử, giúp con người thoát khỏi sự chi phối của vô minh và khổ đau.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 21: Con đường bất tử
"Không phóng dật, đường sống,
Phóng dật, con đường chết;
Không phóng dật, không chết,
Phóng dật, như chết rồi."

Giải thích: Người sống có tỉnh thức, biết quan sát tâm mình là đang đi trên con đường dẫn đến sự giải thoát. Ngược lại, người sống buông thả, chỉ chạy theo dục vọng thì tâm trí mờ mịt, dù thân xác còn sống nhưng tinh thần đã như mê muội, không khác gì người đã khuất.

● Kệ số 24: Thành quả của sự nỗ lực
"Nỗ lực, giữ chánh niệm,
Trong sạch, việc khéo làm,
Tự điều, sống theo Pháp,
Không phóng dật, danh thơm."

Giải thích: Một người kiên trì nỗ lực, luôn giữ tâm trong sáng và sống đúng với đạo lý thì tiếng thơm và sự an lạc sẽ tự nhiên tìm đến. Thành quả không đến từ may mắn, mà đến từ sự rèn luyện bền bỉ mỗi ngày.

● Kệ số 26 & 27: Giữ gìn sự tỉnh thức
"Kẻ ngu hay phóng dật,
Người trí giữ tỉnh thức,
Như giữ kho báu vật,
Không buông lung, không mê."

Giải thích: Đối với người có trí tuệ, sự tỉnh giác quan trọng hơn cả tiền bạc hay vật chất. Họ bảo vệ sự chú tâm của mình giống như bảo vệ một kho báu vô giá, không để những thú vui tạm bợ làm xao nhãng con đường tu học.

3. BÀI HỌC ỨNG DỤNG
- Tập trung vào hiện tại: Đang làm việc gì, biết rõ mình đang làm việc đó, không để tâm trí trôi dạt về quá khứ hay tương lai.
- Rèn luyện kỷ luật: Thiết lập những thói quen tốt và kiên trì thực hiện, không để sự lười biếng (phóng dật) lấn át.
- Coi trọng thời gian: Hiểu rằng mỗi giây phút sống tỉnh thức là một bước tiến gần hơn đến hạnh phúc chân thực.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã nạp thành công Pháp Cú Tập 2 vào mục Kinh Gốc!");
        } catch (e) {
            alert("Lỗi nạp dữ liệu: " + e.message);
        }
    };
</script>
</body>
</html>
