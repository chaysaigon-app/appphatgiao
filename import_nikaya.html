    <p>Nội dung chi tiết Kinh gốc và Giải thích</p>
    <button id="uploadBtn">XÁC NHẬN NẠP DỮ LIỆU</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
        messagingSenderId: "342500331725",
        appId: "1:342500331725:web:32795cf0146210f8019984"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 15: Phẩm An Lạc (Sukha Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-015.jpg",
            content_full: `SỐ CÂU KỆ: 197 ĐẾN 208

1. GIỚI THIỆU SƠ LƯỢC
Phẩm An Lạc (Sukha Vagga) là những lời ca ngợi về một lối sống tự tại. Đức Phật chỉ ra rằng hạnh phúc đích thực không đến từ việc thắng người khác hay có thật nhiều vật chất, mà đến từ một tâm hồn không hận thù, không tham đắm và không phiền não.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 197, 198 & 199: Sống không hận thù
"Vui thay, chúng ta sống,
Không hận, giữa hận thù,
Giữa những người thù hận,
Ta sống, không hận thù." (Kệ 197)

Giải thích: Bí quyết của sự an lạc là không để môi trường xung quanh làm ô nhiễm tâm mình. Khi mọi người xung quanh đang bị thiêu đốt bởi sự giận dữ, nếu bạn giữ được lòng bao dung, bạn chính là người hạnh phúc nhất.

● Kệ số 201: Thắng bại và khổ vui
"Chiến thắng sinh thù oán,
Thất bại chuốc khổ đau,
Từ bỏ mọi thắng bại,
Sống an lạc thong dong."

Giải thích: Trong cuộc đời, khi ta cố gắng thắng người khác, ta vô tình tạo ra kẻ thù. Khi ta thua, ta lại tự dằn vặt bản thân. Chỉ khi ta buông bỏ tâm lý tranh giành, không màng đến chuyện hơn thua, tâm ta mới thực sự được nghỉ ngơi và bình yên.

● Kệ số 204: Những báu vật của cuộc đời
"Không bệnh, lợi tối thượng,
Biết đủ, giàu tối thượng,
Thành tín, thân tối thượng,
Niết-bàn, lạc tối thượng."

Giải thích: Đây là định nghĩa về sự giàu có thật sự. Một cơ thể không bệnh tật, một tâm hồn biết đủ với những gì mình có, một niềm tin chân thành vào chánh pháp và sự giải thoát khỏi mọi phiền não chính là những giá trị cao quý nhất mà một con người có thể đạt được.

3. BÀI HỌC ỨNG DỤNG
- Giữ tâm bình thản: Đừng để những lời nói hay hành động tiêu cực của người khác làm bạn mất đi sự an lạc vốn có.
- Học cách biết đủ: Hãy trân trọng những gì mình đang có thay vì mãi chạy theo những thứ phù du bên ngoài.
- Tránh xa sự tranh giành: Thay vì cố gắng thắng trong một cuộc tranh luận, hãy thắng bằng sự im lặng và thấu hiểu.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã nạp thành công Kinh Pháp Cú Tập 15!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
</script>
</body>
</html>
