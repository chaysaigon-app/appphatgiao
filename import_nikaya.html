    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 12: Phẩm Tự Ngã (Atta Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-012.jpg",
            content_full: `SỐ CÂU KỆ: 157 ĐẾN 166

1. GIỚI THIỆU SƠ LƯỢC
Phẩm Tự Ngã (Atta Vagga) dạy về tinh thần tự lực cánh sinh. Đức Phật khẳng định rằng không ai có thể làm cho người khác trong sạch hay ô nhiễm; chính ta là người tạo ra nghiệp và cũng chính ta là người gặt hái kết quả. Tự làm chủ bản thân là chỗ dựa vững chắc nhất mà không ai có thể thay thế được.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 158: Sửa mình trước khi dạy người
"Trước hết, hãy tự mình,
An trú vào chánh hạnh,
Sau mới giáo hóa người,
Bậc trí không phiền não."

Giải thích: Nếu bạn muốn khuyên bảo hay dạy dỗ người khác sống tốt, trước tiên chính bạn phải thực hành điều đó một cách thuần thục. Khi lời nói đi đôi với việc làm, bạn sẽ có uy tín và nội tâm bình an, không bị những mâu thuẫn giữa lý thuyết và thực hành làm phiền não.

● Kệ số 160: Chỗ dựa của chính mình
"Tự mình làm chỗ dựa,
Ai khác làm chỗ dựa?
Tự mình khéo điều phục,
Được chỗ dựa khó tìm."

Giải thích: Trên thế gian này, không ai có thể che chở hay cứu rỗi ta hoàn toàn ngoài chính sự nỗ lực và tu tập của bản thân. Khi ta rèn luyện được tính tự chủ và điều phục được tâm trí, ta đã tạo cho mình một hòn đảo an toàn, một chỗ dựa tâm linh vững chắc giữa sóng gió cuộc đời.

● Kệ số 165: Sự trong sạch do mình
"Tự mình làm điều ác,
Tự mình làm nhiễm ô,
Tự mình không làm ác,
Tự mình làm trong sạch."

Giải thích: Sự trong sạch hay ô nhiễm của tâm hồn hoàn toàn nằm trong tay bạn. Không một thế lực bên ngoài nào có thể ép bạn làm điều xấu, và cũng không ai có thể ban phát sự thanh tịnh cho bạn. Tất cả đều bắt nguồn từ lựa chọn và hành động của chính cá nhân mỗi người.

3. BÀI HỌC ỨNG DỤNG
- Ngừng đổ lỗi: Hãy chịu trách nhiệm 100% về cảm xúc và hoàn cảnh của mình, thay vì đổ lỗi cho người khác hay số phận.
- Làm gương trong cuộc sống: Thay vì nói lời hay ý đẹp, hãy để hành động tử tế của bạn trở thành bài học sống động cho mọi người xung quanh.
- Rèn luyện tính tự lập: Tập thói quen tự quan sát và sửa đổi tâm trí mình mỗi ngày, xây dựng nội lực vững vàng để không bị lay chuyển bởi ngoại cảnh.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã nạp thành công Kinh Pháp Cú Tập 12!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
