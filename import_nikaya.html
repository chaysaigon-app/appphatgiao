    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 19: Phẩm Pháp Trụ (Dhammaṭṭha Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-019.jpg",
            content_full: `SỐ CÂU KỆ: 256 ĐẾN 272

1. GIỚI THIỆU SƠ LƯỢC
Phẩm Pháp Trụ (Dhammaṭṭha Vagga) giúp chúng ta hiểu thế nào là một người sống đúng theo Chánh pháp. Một người "trú trong Pháp" không phải là người nói nhiều hay có vẻ ngoài đạo mạo, mà là người có tâm công bằng, không thiên vị, luôn hành động dựa trên sự thật và lòng từ bi.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 256 & 257: Định nghĩa về sự công bằng
"Phán quyết có thiên vị,
Không gọi là Pháp trụ,
Bậc trí cần phân biệt,
Cả hai đúng và sai." (Kệ 256)

"Không dùng lời bạo lực,
Phán quyết đúng, công minh,
Bậc trí giữ Chánh pháp,
Được gọi: Bậc Pháp trụ." (Kệ 257)

Giải thích: Một người thực sự thấu hiểu đạo lý sẽ không bao giờ ra quyết định dựa trên sự nóng giận hay thiên vị cá nhân. Họ luôn bình tĩnh xem xét mọi mặt của vấn đề để tìm ra sự thật, và dùng sự công bằng để giải quyết mọi việc thay vì dùng quyền lực hay bạo lực.

● Kệ số 258: Không phải cứ nói nhiều là giỏi
"Không phải nói quá nhiều,
Mới gọi là bậc trí,
An ổn, không oán sợ,
Mới thật bậc hiền trí."

Giải thích: Trí tuệ không nằm ở khả năng tranh luận hay nói lời hoa mỹ. Một người thực sự có trí tuệ là người có nội tâm bình an (an ổn), không gây thù chuốc oán với ai và không sống trong lo âu sợ hãi. Sự im lặng tỉnh thức có giá trị hơn ngàn lời nói sáo rỗng.

● Kệ số 268 & 269: Ý nghĩa của sự im lặng
"Im lặng như kẻ ngu,
Không thành bậc ẩn sĩ,
Bậc trí cầm cân nảy,
Chọn thiện, bỏ điều ác."

Giải thích: Im lặng không có nghĩa là trốn tránh hay thiếu hiểu biết. Sự im lặng của bậc trí là sự im lặng của "cái cân" — luôn quan sát, phân biệt rõ điều gì nên làm và điều gì nên bỏ, từ đó chọn con đường thiện lành để dấn thân.

3. BÀI HỌC ỨNG DỤNG
- Sống công bằng: Tập nhìn nhận mọi việc khách quan, không để tình cảm cá nhân làm mờ đi sự thật.
- Bớt nói, thêm làm: Tập trung vào việc rèn luyện nội tâm an ổn thay vì cố gắng thể hiện kiến thức qua lời nói.
- Giữ vững lập trường: Khi đã biết điều gì là đúng pháp, hãy kiên trì thực hiện dù xung quanh có bao nhiêu biến động.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã nạp thành công Kinh Pháp Cú Tập 19!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
