<script type="module">

    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
        messagingSenderId: "342500331725",
        appId: "1:342500331725:web:32795cf0146210f8019984"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 3: Phẩm Tâm (Citta Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-003.jpg",
            content_full: `SỐ CÂU KỆ: 33 ĐẾN 43

1. GIỚI THIỆU SƠ LƯỢC
Tâm vốn dĩ luôn dao động, khó nắm bắt và khó điều phục như con cá vùng vẫy khi bị đưa ra khỏi nước. Phẩm này dạy chúng ta cách nhận diện bản chất của tâm và tầm quan trọng của việc uốn nắn tâm trí để đạt được sự an lạc đích thực.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 33 & 34: Bản chất của tâm
"Tâm hoảng hốt, dao động,
Khó hộ trì, khó nhiếp,
Người trí uốn tâm thẳng,
Như thợ tên uốn tên." (Kệ 33)

"Như cá quăng lên cạn,
Vứt ra ngoài bản hữu,
Tâm này luôn vùng vẫy,
Thoát khỏi vòng Ma giới." (Kệ 34)

Giải thích: Tâm ta thường nhảy nhót từ chuyện này sang chuyện kia, rất khó kiểm soát. Người có trí tuệ sẽ nỗ lực uốn nắn tâm mình đi vào khuôn khổ, giống như người thợ làm tên tỉ mỉ uốn thẳng từng mũi tên.

● Kệ số 35: Hạnh phúc từ tâm điều phục
"Khó nhiếp, nhẹ, phấn chấn,
Theo các dục quay cuồng,
Lành thay, điều phục tâm,
Tâm điều, hưởng an lạc."

Giải thích: Tâm rất nhẹ, luôn bị các ham muốn (dục vọng) lôi kéo đi khắp nơi. Tuy nhiên, nếu ai học cách làm chủ và điều phục được tâm trí mình, người đó sẽ gặt hái được niềm hạnh phúc và sự bình yên sâu sắc.

● Kệ số 42 & 43: Kẻ thù lớn nhất và Bạn tốt nhất
"Kẻ thù hại kẻ thù,
Oan gia hại oan gia,
Không bằng tâm hướng ác,
Gây ác cho chính mình." (Kệ 42)

"Chẳng phải mẹ, cha làm,
Hay bà con kẻ khác,
Tâm hướng chánh làm tốt,
Cho ta tốt hơn thế." (Kệ 43)

Giải thích: Không có kẻ thù nào có thể làm hại bạn bằng chính cái tâm đầy ác ý của bạn. Ngược lại, không có người thân nào mang lại cho bạn sự an lạc bằng chính một cái tâm được rèn luyện theo hướng thiện.

3. BÀI HỌC ỨNG DỤNG
- Nhận diện sự dao động: Khi tâm lo lắng, hãy nhẹ nhàng nhận biết và đưa nó trở về hiện tại.
- Uốn nắn kiên trì: Việc rèn luyện tâm là một quá trình bền bỉ.
- Tự làm chủ vận mệnh: Hạnh phúc hay khổ đau đều do tâm ta tạo ra.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã cập nhật thành công Kinh Pháp Cú Tập 3!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
</script>
