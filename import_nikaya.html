<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nạp Nguyên Văn MN-01</title>
    <style>
        body { font-family: 'Times New Roman', serif; background: #fdfcf0; padding: 50px; text-align: center; }
        .status-box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: inline-block; border: 2px solid #4a6741; }
        button { background: #4a6741; color: white; padding: 15px 30px; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; }
        #log { margin-top: 20px; color: #4a6741; font-weight: bold; }
    </style>
</head>
<body>
    <div class="status-box">
        <h1>NẠP NGUYÊN VĂN KINH VĂN</h1>
        <p>Đang xử lý: <strong>MN-01 - Kinh Pháp Môn Căn Bản</strong></p>
        <button onclick="autoImportMN01()">KÍCH HOẠT NẠP DỮ LIỆU</button>
        <div id="log">Sẵn sàng nạp bài MN-01...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
            authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
            projectId: "thuvienphatgiao-fd07e",
            storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
            messagingSenderId: "342500331725",
            appId: "1:342500331725:web:32795cf0146210f8019984"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Nội dung nguyên văn bài kinh MN-01
        const mn01Content = `Như vầy tôi nghe. Một thời Thế Tôn ở Ukkattha, tại rừng Subhaga, dưới gốc cây thọ vương (Sala). 

Tại đấy, Thế Tôn gọi các Tỷ-kheo: "Này các Tỷ-kheo!" - "Bạch Thế Tôn", các Tỷ-kheo ấy đáp từ Thế Tôn. Thế Tôn thuyết giảng như sau: "Này các Tỷ-kheo, Ta sẽ giảng cho các Ngươi về pháp môn căn bản của tất cả pháp. Hãy nghe và khéo tác ý, Ta sẽ giảng". 

"Bạch Thế Tôn, vâng ạ", các Tỷ-kheo ấy đáp từ Thế Tôn. Thế Tôn thuyết giảng như sau: Ở đây, này các Tỷ-kheo, có kẻ phàm phu, không được nghe phân biệt, không được thấy các bậc Thánh, không thuần thục pháp các bậc Thánh... kẻ ấy tưởng tri địa đại là địa đại. Vì tưởng tri địa đại là địa đại, kẻ ấy nghĩ đến địa đại, nghĩ đến (tự ngã) đối chiếu với địa đại, nghĩ đến (tự ngã) như là địa đại, nghĩ rằng: "Địa đại là của ta" - kẻ ấy hỷ lạc địa đại. Vì sao vậy? Ta nói rằng: "Vì kẻ ấy không liễu tri địa đại". 

Này các Tỷ-kheo, Tỷ-kheo hữu học, tâm chưa thành tựu, đang sống cần cầu vô thượng an ổn khỏi các khổ ách... Vị ấy thắng tri địa đại là địa đại. Vì thắng tri địa đại là địa đại, vị ấy chớ có nghĩ đến địa đại, chớ có nghĩ đến (tự ngã) đối chiếu với địa đại, chớ có nghĩ đến (tự ngã) như là địa đại, chớ có nghĩ: "Địa đại là của ta" - chớ có hỷ lạc địa đại. Vì sao vậy? Ta nói rằng: "Để vị ấy có thể liễu tri địa đại". 

Này các Tỷ-kheo, Tỷ-kheo là bậc A-la-hán, các lậu hoặc đã tận, phạm hạnh đã thành, việc nên làm đã làm, đã đặt gánh nặng xuống... Vị ấy thắng tri địa đại là địa đại. Vì thắng tri địa đại là địa đại, vị ấy không nghĩ đến địa đại, không nghĩ đến (tự ngã) đối chiếu với địa đại, không nghĩ đến (tự ngã) như là địa đại, không nghĩ: "Địa đại là của ta" - không hỷ lạc địa đại. Vì sao vậy? Ta nói rằng: "Vì vị ấy đã liễu tri địa đại".`;

        window.autoImportMN01 = async () => {
            const log = document.getElementById('log');
            log.innerText = "Đang kết nối và nạp nội dung...";
            try {
                await setDoc(doc(db, "Nikaya_Texts", "MN-01"), {
                    id: "MN-01",
                    title_vi: "Kinh Pháp Môn Căn Bản",
                    content_full: mn01Content,
                    translator: "HT. Thích Minh Châu",
                    last_update: new Date()
                }, { merge: true });
                
                log.innerText = "✅ ĐÃ NẠP THÀNH CÔNG NGUYÊN VĂN BÀI MN-01!";
                alert("Nội dung nguyên văn bài MN-01 đã được cập nhật.");
            } catch (e) {
                log.innerText = "❌ Lỗi: " + e.message;
            }
        };
    </script>
</body>
</html>
