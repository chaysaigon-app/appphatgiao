<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nạp Kinh Pháp Cú Tập 5 - Kinh Gốc</title>
    <style>
        body { background: #000; color: #fff; font-family: Arial; padding: 50px; text-align: center; }
        .box { border: 2px solid #ccff00; padding: 30px; border-radius: 20px; display: inline-block; }
        button { padding: 15px 30px; background: #ccff00; border: none; font-weight: bold; cursor: pointer; border-radius: 10px; font-size: 20px; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="box">
    <h2 style="color: #ccff00;">NẠP BÀI: KINH PHÁP CÚ - TẬP 5: PHẨM NGU</h2>
    <p>Nội dung chi tiết Kinh gốc và Giải thích</p>
    <button id="uploadBtn">XÁC NHẬN NẠP DỮ LIỆU</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
        messagingSenderId: "342500331725",
        appId: "1:342500331725:web:32795cf0146210f8019984"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('uploadBtn').onclick = async () => {
        const postData = {
            title: "Kinh Pháp Cú - Tập 5: Phẩm Ngu (Bala Vagga)",
            img: "https://vapa.vn/wp-content/uploads/2022/12/hinh-anh-phat-dep-lam-hinh-nen-005.jpg",
            content_full: `SỐ CÂU KỆ: 60 ĐẾN 75

1. GIỚI THIỆU SƠ LƯỢC
Phẩm Ngu giúp chúng ta nhận diện những đặc điểm và sai lầm của một tâm trí thiếu trí tuệ. "Ngu" ở đây không phải là kém thông minh về kiến thức đời thường, mà là sự si mê, không hiểu rõ quy luật nhân quả, từ đó tự gây đau khổ cho mình và người khác.

2. NỘI DUNG KINH GỐC & GIẢI THÍCH
● Kệ số 60: Nỗi khổ của sự mê lầm
"Đêm dài cho kẻ thức,
Đường dài cho kẻ mệt,
Luân hồi dài cho kẻ,
Không biết chân diệu pháp."

Giải thích: Giống như một đêm thức trắng thấy thật dài, hay một quãng đường đi khi mệt thấy thật xa, vòng lặp khổ đau (luân hồi) sẽ mãi kéo dài đối với những ai không chịu tìm hiểu và thực hành theo những sự thật cao quý (Diệu pháp) để giải thoát tâm trí.

● Kệ số 63: Định nghĩa về người trí và kẻ ngu
"Người ngu tưởng mình trí,
Thật là ngu vô cùng,
Người ngu biết mình ngu,
Nhờ vậy thành người trí."

Giải thích: Cái ngu nguy hiểm nhất là khi mình sai nhưng lại tự cho là mình đúng, mình giỏi. Ngược lại, nếu một người nhận ra những thiếu sót và sự mê lầm của bản thân, thì chính khoảnh khắc nhận diện đó là bước đầu tiên để trở thành một người có trí tuệ.

● Kệ số 64: Sự vô ích của kiến thức suông
"Người ngu suốt đời này,
Gần gũi người có trí,
Không biết được giáo pháp,
Như muỗng nếm vị canh."

Giải thích: Nếu một người có tâm trí đóng kín và si mê, dù có ở cạnh những bậc thầy giỏi suốt đời cũng không học hỏi được gì. Giống như cái muỗng nằm trong nồi canh, nó tiếp xúc với canh mỗi ngày nhưng chẳng bao giờ cảm nhận được vị ngon của canh; chỉ có "cái lưỡi" (người thực hành) mới biết vị.

3. BÀI HỌC ỨNG DỤNG
- Khiêm tốn học hỏi: Luôn giữ tâm thế sẵn sàng nhận lỗi và sửa mình để không rơi vào cái "ngu" của sự tự mãn.
- Học đi đôi với Hành: Đừng chỉ nghe kinh điển để biết, hãy thực hành để thực sự "nếm" được vị an lạc.
- Chọn bạn mà chơi: Tránh xa những ảnh hưởng tiêu cực từ những người không có chánh kiến để bảo vệ tâm trí mình.`,
            hidden: false,
            createdAt: new Date()
        };

        try {
            await addDoc(collection(db, "Nikaya_Texts"), postData);
            alert("Đã nạp thành công Kinh Pháp Cú Tập 5!");
        } catch (e) {
            alert("Lỗi: " + e.message);
        }
    };
</script>
</body>
</html>
