<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Quản Trị Toàn Diện</title>
    <style>
        :root { --den: #000; --vang: #ccff00; --do: #ff4444; --xanh: #2ecc71; --xanh-duong: #3498db; --xam: #7f8c8d; --tim: #7b1fa2; }
        body { background: var(--den); color: #fff; font-family: Arial, sans-serif; padding: 20px; }
        
        /* Khóa bảo mật */
        #lockScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .lock-box { border: 3px solid var(--vang); padding: 50px; border-radius: 20px; text-align: center; background: #0a0a0a; }
        .lock-input { padding: 15px; font-size: 24px; text-align: center; border-radius: 10px; border: none; margin-bottom: 20px; width: 280px; background: #111; color: #fff; border: 1px solid #444; }
        
        /* Bố cục chính */
        #mainContent { display: none; max-width: 1200px; margin: auto; }
        h1 { color: var(--vang); text-align: center; text-transform: uppercase; border-bottom: 2px solid #333; padding-bottom: 20px; }
        
        .tab-menu { display: flex; gap: 10px; margin: 30px 0; flex-wrap: wrap; }
        .tab-btn { flex: 1; min-width: 150px; padding: 18px; background: #111; color: #fff; border: 2px solid var(--vang); cursor: pointer; font-weight: bold; border-radius: 10px; font-size: 16px; }
        .tab-btn.active { background: var(--vang); color: #000; }

        /* Bảng danh sách */
        table { width: 100%; border-collapse: collapse; background: #111; border-radius: 15px; overflow: hidden; }
        th, td { padding: 20px; border-bottom: 1px solid #333; text-align: left; }
        th { background: #222; color: var(--vang); text-transform: uppercase; }
        
        /* Bộ nút chức năng */
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-act { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; text-transform: uppercase; min-width: 80px; }
        .btn-view { background: var(--xanh-duong); color: #fff; }
        .btn-edit { background: #f1c40f; color: #000; }
        .btn-hide { background: var(--xam); color: #fff; }
        .btn-show { background: var(--xanh); color: #fff; }
        .btn-del { background: var(--do); color: #fff; }

        /* Modal Sửa/Xem */
        #editModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .modal-content { max-width: 800px; margin: 40px auto; background: #1a1a1a; padding: 40px; border: 2px solid var(--vang); border-radius: 20px; }
        input, textarea { width: 100%; padding: 15px; margin: 15px 0; background: #000; color: #fff; border: 1px solid #444; border-radius: 10px; font-size: 18px; box-sizing: border-box; }
        label { color: var(--vang); font-weight: bold; display: block; margin-top: 10px; }
    </style>
</head>
<body>

<div id="lockScreen">
    <div class="lock-box">
        <h2 style="color:var(--vang)">XÁC THỰC QUẢN TRỊ</h2>
        <input type="password" id="passInput" class="lock-input" placeholder="Mật khẩu..."><br>
        <button onclick="checkPass()" style="padding:15px 50px; background:var(--vang); font-weight:bold; cursor:pointer; border-radius:10px; border:none; font-size:20px;">TRUY CẬP</button>
    </div>
</div>

<div id="mainContent">
    <h1>QUẢN LÝ BÀI ĐĂNG</h1>
    <div class="tab-menu">
        <button id="btn-Nikaya_Texts" class="tab-btn active" onclick="switchTab('Nikaya_Texts')">1. KINH GỐC</button>
        <button id="btn-Infographics_Library" class="tab-btn" onclick="switchTab('Infographics_Library')">2. INFOGRAPHIC</button>
        <button id="btn-Video_Shorts" class="tab-btn" onclick="switchTab('Video_Shorts')">3. VIDEO</button>
        <button id="btn-Audio_Lectures" class="tab-btn" onclick="switchTab('Audio_Lectures')">4. AUDIO</button>
    </div>
    <table>
        <thead><tr><th>Tựa bài học</th><th>Trạng thái</th><th>Thao tác quản lý</th></tr></thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<div id="editModal">
    <div class="modal-content">
        <h2 id="modalTitle" style="color: var(--vang); text-align: center;">CẬP NHẬT</h2>
        <input type="hidden" id="editId">
        
        <label>Tiêu đề:</label>
        <input type="text" id="editInpTitle">
        
        <div id="extraFields">
            <label id="lblSpecial">ID YouTube / Spotify / Link Ảnh:</label>
            <input type="text" id="editInpSpecial">
            
            <label id="lblContent">Nội dung / Mô tả:</label>
            <textarea id="editInpContent" style="height: 250px;"></textarea>
        </div>

        <div id="editActions">
            <button onclick="saveUpdate()" style="width: 100%; padding: 20px; background: var(--xanh); border: none; font-weight: bold; font-size: 20px; border-radius: 10px; cursor: pointer;">LƯU THÔNG TIN</button>
        </div>
        <button onclick="document.getElementById('editModal').style.display='none'" style="width: 100%; margin-top: 15px; padding: 15px; background: #444; color: #fff; border: none; border-radius: 10px; cursor: pointer;">ĐÓNG</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, deleteDoc, doc, updateDoc, getDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
        messagingSenderId: "342500331725",
        appId: "1:342500331725:web:32795cf0146210f8019984"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let currentTab = 'Nikaya_Texts';

    window.checkPass = () => {
        if (document.getElementById('passInput').value === 'admin@8899') {
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            loadPosts();
        } else { alert("Sai mật khẩu!"); }
    };

    async function loadPosts() {
        const q = query(collection(db, currentTab), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);
        const body = document.getElementById('tableBody');
        body.innerHTML = "";
        
        snap.forEach((docSnap) => {
            const d = docSnap.data();
            const id = docSnap.id;
            const isHidden = d.hidden === true;
            const title = d.title || "Chưa có tựa";

            body.innerHTML += `
                <tr>
                    <td><strong>${title}</strong></td>
                    <td style="color: ${isHidden ? 'red' : 'lime'}">${isHidden ? 'ĐANG ẨN' : 'HIỂN THỊ'}</td>
                    <td>
                        <div class="btn-group">
                            <button class="btn-act btn-view" onclick="openEdit('${id}', true)">XEM</button>
                            <button class="btn-act btn-edit" onclick="openEdit('${id}', false)">SỬA</button>
                            <button class="btn-act ${isHidden ? 'btn-show' : 'btn-hide'}" onclick="toggleHide('${id}', ${isHidden})">
                                ${isHidden ? 'HIỆN' : 'ẨN'}
                            </button>
                            <button class="btn-act btn-del" onclick="deletePost('${id}')">XÓA</button>
                        </div>
                    </td>
                </tr>`;
        });
    }

    window.openEdit = async (id, isViewOnly) => {
        const d = (await getDoc(doc(db, currentTab, id))).data();
        document.getElementById('editId').value = id;
        document.getElementById('editInpTitle').value = d.title;
        
        // Điều chỉnh linh hoạt theo Tab
        const specialInp = document.getElementById('editInpSpecial');
        const contentInp = document.getElementById('editInpContent');
        
        if (currentTab === 'Video_Shorts') {
            specialInp.value = d.youtube_id;
            document.getElementById('lblSpecial').innerText = "YouTube ID:";
            contentInp.style.display = "none"; document.getElementById('lblContent').style.display = "none";
        } else if (currentTab === 'Audio_Lectures') {
            specialInp.value = d.spotify_id;
            document.getElementById('lblSpecial').innerText = "Spotify ID:";
            contentInp.style.display = "none"; document.getElementById('lblContent').style.display = "none";
        } else {
            specialInp.value = d.img;
            document.getElementById('lblSpecial').innerText = "Link Ảnh (9:16):";
            contentInp.value = d.content_full || d.desc;
            contentInp.style.display = "block"; document.getElementById('lblContent').style.display = "block";
        }

        document.getElementById('editActions').style.display = isViewOnly ? 'none' : 'block';
        document.getElementById('modalTitle').innerText = isViewOnly ? "XEM CHI TIẾT" : "CẬP NHẬT BÀI ĐĂNG";
        document.getElementById('editModal').style.display = 'block';
    };

    window.saveUpdate = async () => {
        const id = document.getElementById('editId').value;
        const upData = {
            title: document.getElementById('editInpTitle').value
        };

        if (currentTab === 'Video_Shorts') {
            upData.youtube_id = document.getElementById('editInpSpecial').value;
        } else if (currentTab === 'Audio_Lectures') {
            upData.spotify_id = document.getElementById('editInpSpecial').value;
        } else {
            upData.img = document.getElementById('editInpSpecial').value;
            upData.content_full = document.getElementById('editInpContent').value;
        }

        await updateDoc(doc(db, currentTab, id), upData);
        alert("Đã cập nhật!");
        document.getElementById('editModal').style.display = 'none';
        loadPosts();
    };

    window.toggleHide = async (id, currentHidden) => {
        await updateDoc(doc(db, currentTab, id), { hidden: !currentHidden });
        loadPosts();
    };

    window.deletePost = async (id) => {
        if(confirm("Xóa vĩnh viễn khỏi hệ thống?")) {
            await deleteDoc(doc(db, currentTab, id));
            loadPosts();
        }
    };

    window.switchTab = (tab) => {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + tab).classList.add('active');
        loadPosts();
    };
</script>
</body>
</html>
