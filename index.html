<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Tự Học Phật - Học Chánh Pháp</title>
    <style>
        :root {
            --den: #000000; --nen-the: #1a1a1a; --vang-chanh: #ccff00; 
            --chu-trang: #ffffff; --xanh: #2e7d32; --cam: #e65100; --do: #c62828; --tim: #7b1fa2;
        }
        body { background: var(--den); color: var(--chu-trang); font-family: Arial, sans-serif; margin: 0; padding-bottom: 80px; font-size: 20px; }
        header { text-align: center; padding: 30px; border-bottom: 3px solid var(--vang-chanh); background: #0a0a0a; }
        h1 { font-size: 34px; color: var(--vang-chanh); text-transform: uppercase; margin: 0; }

        /* Cấu trúc Grid & Thẻ cũ */
        .phan-muc { padding: 25px 15px; }
        .phan-tieu-de { font-size: 28px; color: var(--vang-chanh); border-left: 8px solid; padding-left: 12px; margin-bottom: 20px; text-transform: uppercase; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 25px; }
        .the-916 { display: flex; background: var(--nen-the); border-radius: 15px; overflow: hidden; height: 220px; border: 1px solid #333; }
        .anh-the { width: 130px; min-width: 130px; background-size: cover; background-position: center; }
        .noi-dung-the { flex: 1; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        .nut-hoc { background: var(--vang-chanh); color: black; border: none; padding: 10px 20px; border-radius: 8px; font-size: 18px; font-weight: 900; cursor: pointer; text-transform: uppercase; width: fit-content; }

        /* Popup Float */
        #modalDoc { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--den); z-index: 99999; overflow-y: scroll; }
        .modal-body-content { max-width: 800px; margin: 0 auto; padding: 40px 20px 100px; text-align: center; }
        .btn-dong { position: sticky; top: 20px; right: 0; z-index: 100000; float: right; padding: 12px 25px; background: var(--vang-chanh); color: #000; border: none; font-size: 20px; font-weight: bold; border-radius: 10px; cursor: pointer; }

        /* Hệ thống bình luận mới bên trong Popup */
        #commentSection { margin-top: 50px; padding: 20px; background: #0a0a0a; border-radius: 15px; border-top: 2px dashed #333; text-align: left; }
        .comment-item { background: #111; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--vang-chanh); }
        .admin-tag { color: var(--vang-chanh); font-weight: bold; font-size: 14px; margin-right: 5px; }
        textarea { width: 100%; padding: 12px; border-radius: 8px; background: #000; color: #fff; border: 1px solid var(--vang-chanh); font-size: 18px; box-sizing: border-box; }
        .btn-send { background: var(--xanh); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<header><h1>THƯ VIỆN TỰ HỌC PHẬT</h1></header>

<div class="phan-muc"><div class="phan-tieu-de" style="border-left-color: var(--xanh);">📜 I. BẢN GỐC KINH NIKAYA</div><div id="gridKinh" class="grid"></div></div>
<div class="phan-muc"><div class="phan-tieu-de" style="border-left-color: var(--cam);">🎨 II. TÓM TẮT HÌNH ẢNH</div><div id="gridInfo" class="grid"></div></div>
<div class="phan-muc"><div class="phan-tieu-de" style="border-left-color: var(--do);">📽️ III. VIDEO</div><div id="gridVideo" class="grid"></div></div>
<div class="phan-muc"><div class="phan-tieu-de" style="border-left-color: var(--tim);">🎧 IV. AUDIO</div><div id="gridAudio" class="grid"></div></div>

<div id="modalDoc">
    <div class="modal-body-content">
        <button onclick="dongBaiHoc()" class="btn-dong">X ĐÓNG</button>
        <h2 id="mTitle" style="color:var(--vang-chanh); font-size:36px; margin-top:60px;"></h2>
        <img id="mImg" src="" style="width:100%; max-width:450px; border-radius:15px; margin:25px 0; border:2px solid var(--vang-chanh);">
        <div id="mBody" style="font-size:26px; line-height:1.8; text-align:justify; white-space: pre-wrap; color:#fff; margin-bottom:40px;"></div>

        <div id="commentSection">
            <h3 style="color:var(--vang-chanh)">💬 THẢO LUẬN & GHI CHÚ</h3>
            <div id="commentList" style="margin-bottom:20px;"></div>
            <textarea id="txtComment" placeholder="Nhập thảo luận của bạn..."></textarea>
            <button class="btn-send" onclick="sendComment()">GỬI BÌNH LUẬN</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getDatabase, ref, push, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE", 
        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com", 
        projectId: "thuvienphatgiao-fd07e", 
        databaseURL: "https://thuvienphatgiao-fd07e-default-rtdb.asia-southeast1.firebasedatabase.app", 
        appId: "1:342500331725:web:32795cf0146210f8019984" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const rtdb = getDatabase(app);

    window.baiHocData = {};
    window.currentPostId = null;

    async function loadAll() {
        const fetchCol = async (name, gridId) => {
            const snap = await getDocs(collection(db, name));
            const grid = document.getElementById(gridId); grid.innerHTML = "";
            snap.forEach(doc => {
                const id = doc.id; const d = doc.data();
                window.baiHocData[id] = d;
                if (name === "Audio_Lectures") {
                    grid.innerHTML += `<div class="grid"><iframe style="border-radius:12px" src="https://open.spotify.com/embed/episode/${d.spotify_id}?utm_source=generator&theme=0" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>`;
                } else {
                    grid.innerHTML += `<div class="the-916"><div class="anh-the" style="background-image: url('${d.img}')"></div><div class="noi-dung-the"><h3 style="font-size:18px">${d.title}</h3><button class="nut-hoc" onclick="moBaiHoc('${id}')">Học Ngay</button></div></div>`;
                }
            });
        };
        await fetchCol("Nikaya_Texts", "gridKinh"); await fetchCol("Infographics_Library", "gridInfo"); await fetchCol("Video_Shorts", "gridVideo"); await fetchCol("Audio_Lectures", "gridAudio");
    }

    window.moBaiHoc = function(id) {
        const d = window.baiHocData[id];
        window.currentPostId = id;
        document.getElementById('mTitle').innerText = d.title;
        document.getElementById('mImg').src = d.img || "";
        document.getElementById('mBody').innerText = d.content_full || "";
        document.getElementById('modalDoc').style.display = 'block';
        document.body.style.overflow = 'hidden';
        loadComments(id);
    };

    window.dongBaiHoc = function() { document.getElementById('modalDoc').style.display = 'none'; document.body.style.overflow = 'auto'; };

    function loadComments(postId) {
        onValue(ref(rtdb, `comments/${postId}`), (snapshot) => {
            const list = document.getElementById('commentList');
            list.innerHTML = "";
            const data = snapshot.val();
            if (data) {
                Object.values(data).reverse().forEach(c => {
                    const tag = c.isAdmin ? '<span class="admin-tag">🛡️ Admin:</span>' : '<b>👤 Người học:</b> ';
                    list.innerHTML += `<div class="comment-item">${tag} ${c.text}</div>`;
                });
            } else { list.innerHTML = "<p style='opacity:0.3'>Chưa có thảo luận.</p>"; }
        });
    }

    window.sendComment = function() {
        const text = document.getElementById('txtComment').value;
        if (!text.trim() || !window.currentPostId) return;
        push(ref(rtdb, `comments/${window.currentPostId}`), {
            text: text,
            timestamp: Date.now(),
            isAdmin: false // Chỉnh thành true khi bạn tự trả lời
        });
        document.getElementById('txtComment').value = "";
    };

    loadAll();
</script>
</body>
</html>
