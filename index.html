<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Phật Giáo - Học Chánh Pháp</title>
    <style>
        :root {
            --den: #000000; --nen-the: #1a1a1a; --vang-chanh: #ccff00; 
            --chu-trang: #ffffff; --xanh: #2e7d32; --cam: #e65100; --do: #c62828;
        }
        body { 
            background: var(--den); color: var(--chu-trang); 
            font-family: Arial, sans-serif; margin: 0; padding-bottom: 80px; font-size: 22px; 
        }
        header { text-align: center; padding: 30px; border-bottom: 3px solid var(--vang-chanh); background: #0a0a0a; }
        h1 { font-size: 38px; color: var(--vang-chanh); text-transform: uppercase; margin: 0; }

        /* Tìm kiếm & Chủ đề */
        .search-box { padding: 20px; display: flex; justify-content: center; }
        #searchInput { width: 90%; max-width: 600px; padding: 15px; border-radius: 40px; border: 2px solid var(--vang-chanh); font-size: 22px; background: #000; color: #fff; text-align: center; }
        .vung-chu-de { padding: 20px; background: #0a0a0a; border-bottom: 2px solid #333; }
        .topic-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 15px; }
        .chip { background: #263238; color: white; padding: 12px 25px; border-radius: 40px; border: 2px solid var(--vang-chanh); font-size: 20px; white-space: nowrap; cursor: pointer; }

        /* Phân vùng */
        .phan-muc { padding: 30px 20px; }
        .phan-tieu-de { font-size: 32px; color: var(--vang-chanh); border-left: 10px solid; padding-left: 15px; margin-bottom: 25px; text-transform: uppercase; }
        .vach-kinh { border-color: var(--xanh); }
        .vach-info { border-color: var(--cam); }
        .vach-video { border-color: var(--do); }

        /* Grid hiển thị */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 30px; }
        .the-916 { display: flex; background: var(--nen-the); border-radius: 20px; overflow: hidden; height: 220px; border: 2px solid #333; }
        .anh-the { width: 140px; min-width: 140px; background-size: cover; background-position: center; }
        .noi-dung-the { flex: 1; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* Tự động viết hoa chữ cái đầu cho tiêu đề */
        .the-title { 
            margin: 0; font-size: 26px; color: #fff; font-weight: bold;
            text-transform: capitalize; /* Tự động viết hoa đầu mỗi từ */
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; 
        }
        
        .nut-hoc { background: var(--vang-chanh); color: black; border: none; padding: 12px; border-radius: 10px; font-size: 22px; font-weight: 900; cursor: pointer; text-transform: uppercase; }

        /* Grid Video */
        .grid-video { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
        .the-video { background: var(--nen-the); border-radius: 20px; overflow: hidden; border: 2px solid var(--do); }
        .video-box { position: relative; width: 100%; padding-bottom: 177.7%; height: 0; background: #000; }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .video-title { padding: 15px; text-align: center; font-size: 22px; font-weight: bold; color: #fff; text-transform: capitalize; }

        /* Popup */
        #modalDoc { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--den); z-index: 99999; overflow-y: scroll; }
        .modal-body-content { max-width: 850px; margin: 0 auto; padding: 40px 20px 100px; text-align: center; }
        .btn-dong { position: sticky; top: 20px; right: 0; z-index: 100000; float: right; padding: 15px 30px; background: var(--vang-chanh); color: #000; border: none; font-size: 22px; font-weight: bold; border-radius: 10px; cursor: pointer; }
        .img-popup { width: 100%; max-width: 500px; border-radius: 15px; margin: 30px 0; border: 2px solid var(--vang-chanh); }
    </style>
</head>
<body>

<header><h1>THƯ VIỆN PHẬT GIÁO</h1></header>

<div class="search-box"><input type="text" id="searchInput" placeholder="Tìm kiếm bài học..." onkeyup="locBai()"></div>

<div class="vung-chu-de"><div class="topic-scroll" id="topicList"></div></div>

<div class="phan-muc"><div class="phan-tieu-de vach-kinh">📜 I. BẢN GỐC KINH NIKAYA</div><div id="gridKinh" class="grid"></div></div>
<div class="phan-muc"><div class="phan-tieu-de vach-info">🎨 II. TÓM TẮT HÌNH ẢNH</div><div id="gridInfo" class="grid"></div></div>
<div class="phan-muc"><div class="phan-tieu-de vach-video">📽️ III. BÀI GIẢNG VIDEO</div><div id="gridVideo" class="grid-video"></div></div>

<footer style="text-align:center; padding:50px; opacity:0.1" onclick="location.href='admin.html'">⚙️</footer>

<div id="modalDoc">
    <div class="modal-body-content">
        <button onclick="dongBaiHoc()" class="btn-dong">X ĐÓNG BÀI</button>
        <h2 id="mTitle" style="color:var(--vang-chanh); font-size:42px; margin-top:80px; border-bottom:3px solid #333; padding-bottom:20px; text-transform: capitalize;"></h2>
        <img id="mImg" src="" class="img-popup">
        <div id="mBody" style="font-size:28px; line-height:1.9; text-align:justify; white-space: pre-wrap; color:#fff;"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
        messagingSenderId: "342500331725",
        appId: "1:342500331725:web:32795cf0146210f8019984"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.baiHocData = {};

    async function loadAll() {
        const fetchCol = async (name, gridId) => {
            // Chỉ lấy những bài không bị ẩn (hidden != true)
            const q = query(collection(db, name), where("hidden", "!=", true));
            const snap = await getDocs(q);
            const grid = document.getElementById(gridId); grid.innerHTML = "";
            
            if (snap.empty) {
                grid.innerHTML = "<p style='padding:20px; opacity:0.3;'>Chưa có bài đăng.</p>";
                return;
            }

            snap.forEach(doc => {
                const id = doc.id; const d = doc.data(); window.baiHocData[id] = d;
                if (name === "Video_Shorts") {
                    grid.innerHTML += `
                        <div class="the-video item-the">
                            <div class="video-box"><iframe src="https://www.youtube.com/embed/${d.youtube_id}" allowfullscreen></iframe></div>
                            <div class="video-title">${d.title}</div>
                        </div>`;
                } else {
                    grid.innerHTML += `
                        <div class="the-916 item-the">
                            <div class="anh-the" style="background-image: url('${d.img}')"></div>
                            <div class="noi-dung-the">
                                <h3 class="the-title">${d.title}</h3>
                                <button class="nut-hoc" onclick="moBaiHoc('${id}')">Học Ngay</button>
                            </div>
                        </div>`;
                }
            });
        };
        await fetchCol("Nikaya_Texts", "gridKinh"); await fetchCol("Infographics_Library", "gridInfo"); await fetchCol("Video_Shorts", "gridVideo");
    }
    loadAll();
</script>

<script>
    function moBaiHoc(id) {
        const d = window.baiHocData[id];
        if (d) {
            document.getElementById('mTitle').innerText = d.title;
            document.getElementById('mImg').src = d.img || "";
            document.getElementById('mBody').innerText = d.content_full || "";
            document.getElementById('modalDoc').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }
    }
    function dongBaiHoc() { document.getElementById('modalDoc').style.display = 'none'; document.body.style.overflow = 'auto'; }
    const topics = ["Chánh Kiến", "Làm Giàu", "Báo Hiếu", "Sức Khỏe", "Nhân Quả", "Vợ Chồng", "Nuôi Con", "Giận Dữ"];
    document.getElementById('topicList').innerHTML = topics.map(t => `<div class="chip" onclick="filterTopic('${t}')">🪷 ${t}</div>`).join('');
    function filterTopic(t) { document.getElementById('searchInput').value = t; locBai(); }
    function locBai() {
        let k = document.getElementById('searchInput').value.toLowerCase();
        let items = document.getElementsByClassName('item-the');
        for (let i of items) { i.style.display = i.innerText.toLowerCase().includes(k) ? "block" : "none"; }
    }
</script>
</body>
</html>
