<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thiết Lập Hệ Thống 3 Kho Độc Lập</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #fdfcf0; }
        .box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: inline-block; border: 2px solid #4a6741; }
        button { background: #4a6741; color: white; border: none; padding: 20px 40px; font-size: 18px; border-radius: 10px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        button:hover { background: #3d5435; transform: scale(1.02); }
        #status { margin-top: 25px; text-align: left; max-height: 250px; overflow-y: auto; font-family: monospace; font-size: 14px; color: #555; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <h1 style="color: #4a6741;">CÀI ĐẶT HỆ THỐNG PHẬT GIÁO</h1>
        <p>Nhấn nút để xoá sạch dữ liệu cũ và khởi tạo 3 kho: Kinh văn, Ảnh, Video.</p>
        <button onclick="runSystemUpdate()">KÍCH HOẠT HỆ THỐNG MỚI</button>
        <div id="status">Sẵn sàng thực thi...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, deleteDoc, doc, setDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
            authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
            projectId: "thuvienphatgiao-fd07e",
            storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
            messagingSenderId: "342500331725",
            appId: "1:342500331725:web:32795cf0146210f8019984"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function deleteCol(name) {
            const snap = await getDocs(collection(db, name));
            await Promise.all(snap.docs.map(d => deleteDoc(doc(db, name, d.id))));
            return `> Đã dọn kho: ${name}<br>`;
        }

        window.runSystemUpdate = async () => {
            const log = document.getElementById('status');
            log.innerHTML = "Đang dọn dẹp dữ liệu cũ...<br>";
            try {
                // Xoá sạch tàn dư cũ
                log.innerHTML += await deleteCol("Nikaya_Library");
                log.innerHTML += await deleteCol("Lessons");
                log.innerHTML += await deleteCol("Categories");

                // Khởi tạo 3 kho độc lập đúng ý tưởng
                // 1. Kinh điển
                await setDoc(doc(db, "Nikaya_Texts", "MN-01"), {
                    id: "MN-01",
                    title_vi: "Kinh Pháp Môn Căn Bản",
                    content: "Bản dịch của HT. Thích Minh Châu: Đức Thế Tôn thuyết về cách liễu tri các pháp...",
                    translator: "HT. Thích Minh Châu"
                });
                log.innerHTML += "> Tạo kho Kinh điển thành công.<br>";

                // 2. Infographic
                await addDoc(collection(db, "Infographics_Library"), {
                    url_916: "https://via.placeholder.com/1080x1920?text=Anh+Tom+Luoc+9:16",
                    summary: "Tóm tắt tri thức Phật giáo qua hình ảnh trực quan.",
                    topic: "Chủ đề Phước Đức"
                });
                log.innerHTML += "> Tạo kho Ảnh thành công.<br>";

                // 3. Video Shorts
                await addDoc(collection(db, "Video_Shorts"), {
                    youtube_id: "dQw4w9WgXcQ",
                    title: "Bài giảng ngắn Chánh Kiến",
                    description: "Trích đoạn bài giảng súc tích."
                });
                log.innerHTML += "> Tạo kho Video thành công.<br>";

                log.innerHTML += "<br><strong style='color:green'>HOÀN TẤT! Hãy báo cho mình biết để mình gửi code HIỂN THỊ cho bạn dán đè vào file này.</strong>";
            } catch (e) { log.innerHTML += `<br><strong style='color:red'>LỖI: ${e.message}</strong>`; }
        };
    </script>
</body>
</html>
