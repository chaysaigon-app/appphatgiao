<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Phật Giáo - Tự Học Chánh Pháp</title>
    <style>
        :root {
            --den-tuyet-doi: #000000;
            --nen-the: #1a1a1a;
            --vang-chanh: #ccff00; 
            --chu-trang: #ffffff;
            --xanh-kinh: #2e7d32;
            --cam-info: #e65100;
            --do-video: #c62828;
        }

        body { 
            background: var(--den-tuyet-doi); 
            color: var(--chu-trang); 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; padding-bottom: 80px;
            font-size: 22px; 
        }

        header { text-align: center; padding: 40px 20px; border-bottom: 3px solid var(--vang-chanh); background: #0a0a0a; }
        h1 { font-size: 45px; color: var(--vang-chanh); text-transform: uppercase; margin: 0; letter-spacing: 2px; }

        .die-huong-chinh { display: grid; grid-template-columns: 1fr; gap: 20px; padding: 30px 20px; }
        @media (min-width: 800px) { .die-huong-chinh { grid-template-columns: 1fr 1fr 1fr; } }
        
        .nut-bam { 
            padding: 30px; border-radius: 20px; font-size: 26px; font-weight: 900; 
            cursor: pointer; color: white; border: none; text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); text-decoration: none;
        }
        .nut-kinh { background: var(--xanh-kinh); border-bottom: 8px solid #1b5e20; }
        .nut-info { background: var(--cam-info); border-bottom: 8px solid #bf360c; }
        .nut-video { background: var(--do-video); border-bottom: 8px solid #8e0000; }

        .vung-chu-de { padding: 25px; background: #0a0a0a; border-bottom: 2px solid #333; }
        .tieu-de-muc { color: var(--vang-chanh); font-size: 30px; font-weight: bold; margin-bottom: 20px; display: block; }
        .danh-sach-chu-de { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 20px; }
        .the-chu-de { 
            background: #263238; color: white; padding: 15px 30px; border-radius: 40px; 
            white-space: nowrap; border: 2px solid var(--vang-chanh); font-size: 22px; font-weight: bold;
        }

        .phan-muc { padding: 40px 20px; }
        .phan-tieu-de { 
            font-size: 35px; color: var(--vang-chanh); border-left: 10px solid; 
            padding-left: 20px; margin-bottom: 30px; text-transform: uppercase;
        }
        .vach-kinh { border-color: var(--xanh-kinh); }
        .vach-info { border-color: var(--cam-info); }
        .vach-video { border-color: var(--do-video); }

        .luoi-noi-dung { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 40px; }
        .the-916 { 
            display: flex; background: var(--nen-the); border-radius: 25px; 
            overflow: hidden; height: 350px; border: 2px solid #333;
        }
        .anh-the { width: 200px; background-size: cover; background-position: center; position: relative; }
        .ma-so { 
            position: absolute; bottom: 0; background: rgba(0,0,0,0.8); 
            width: 100%; color: var(--vang-chanh); text-align: center; padding: 10px 0; font-weight: 900;
        }
        .noi-dung-the { flex: 1; padding: 25px; display: flex; flex-direction: column; }
        .noi-dung-the h3 { margin: 0 0 15px; font-size: 28px; line-height: 1.2; }
        .noi-dung-the p { font-size: 20px; color: #b0bec5; line-height: 1.5; flex-grow: 1; }
        .nut-doc-tiep { 
            background: var(--vang-chanh); color: black; border: none; padding: 15px; 
            border-radius: 12px; font-size: 22px; font-weight: 900; cursor: pointer;
        }

        footer { text-align: center; padding: 50px; opacity: 0.6; font-size: 18px; border-top: 1px solid #333; }
    </style>
</head>
<body>

<header>
    <h1>THƯ VIỆN PHẬT GIÁO</h1>
</header>

<div class="die-huong-chinh">
    <a href="#phan-kinh" class="nut-bam nut-kinh">📖 1. BẢN GỐC<br>KINH NIKAYA</a>
    <a href="#phan-info" class="nut-bam nut-info">🖼️ 2. TÓM TẮT<br>INFOGRAPHIC</a>
    <a href="#phan-video" class="nut-bam nut-video">🎬 3. BÀI GIẢNG<br>VIDEO SHORTS</a>
</div>

<div class="vung-chu-de">
    <span class="tieu-de-muc">🪷 CHỌN CHỦ ĐỀ QUAN TÂM:</span>
    <div class="danh-sach-chu-de" id="topicList"></div>
</div>

<div class="phan-muc" id="phan-kinh">
    <div class="phan-tieu-de vach-kinh">📜 I. HỌC BẢN GỐC KINH NIKAYA</div>
    <div class="luoi-noi-dung" id="gridKinh"></div>
</div>

<div class="phan-muc" id="phan-info">
    <div class="phan-tieu-de vach-info">🎨 II. HỌC QUA HÌNH ẢNH (INFOGRAPHIC)</div>
    <div class="luoi-noi-dung" id="gridInfo"></div>
</div>

<div class="phan-muc" id="phan-video">
    <div class="phan-tieu-de vach-video">📽️ III. BÀI GIẢNG VIDEO NGẮN</div>
    <div class="luoi-noi-dung" id="gridVideo"></div>
</div>

<footer>
    <p>Dịch giả: Cố Hòa Thượng Thích Minh Châu</p>
    <p>Hỗ trợ: Zalo 0909108890</p>
</footer>

<script>
    const topics = [
        "Chánh Kiến", "Làm Giàu", "Nuôi Con", "Vợ Chồng", "Báo Hiếu", 
        "Sức Khỏe", "Vượt Khổ", "Tứ Diệu Đế", "Nhân Quả", "Thiền Định",
        "Giận Dữ", "Buông Xả", "Tình Thương", "Trí Tuệ", "Công Việc",
        "Bạn Bè", "Lời Nói", "Ăn Chay", "Bố Thí", "Tái Sinh"
    ];

    const sampleData = {
        kinh: [{id: "MN-01", title: "Căn Bản Mọi Pháp", desc: "Cách nhìn đúng đắn để không bị lầm lạc.", img: "https://images.unsplash.com/photo-1542353436-312f0ebbf670?w=400"}],
        info: [{id: "IF-01", title: "Gieo Nhân Tài Lộc", desc: "5 cách tạo phước đức để giàu sang bền vững.", img: "https://images.unsplash.com/photo-1579621970563-ebec7560ff3e?w=400"}],
        video: [{id: "VD-01", title: "Lòng Biết Ơn", desc: "Sức mạnh của sự tri ân cha mẹ.", img: "https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=400"}]
    };

    function start() {
        document.getElementById('topicList').innerHTML = topics.map(t => 
            `<div class="the-chu-de">🪷 ${t}</div>`
        ).join('');

        const draw = (data, elementId) => {
            document.getElementById(elementId).innerHTML = data.map(d => `
                <div class="the-916">
                    <div class="anh-the" style="background-image: url('${d.img}')">
                        <div class="ma-so">${d.id}</div>
                    </div>
                    <div class="noi-dung-the">
                        <h3>${d.title}</h3>
                        <p>${d.desc}</p>
                        <button class="nut-doc-tiep">BẤM ĐỂ HỌC TIẾP</button>
                    </div>
                </div>
            `).join('');
        };

        draw(sampleData.kinh, 'gridKinh');
        draw(sampleData.info, 'gridInfo');
        draw(sampleData.video, 'gridVideo');
    }

    start();
</script>

</body>
</html>
