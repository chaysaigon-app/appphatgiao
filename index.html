<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tự Học Phật – Học Phật Pháp Mỗi Ngày</title>
  <meta name="description" content="Nền tảng phi lợi nhuận học Phật Pháp. Kinh Nikaya, Pháp Cú, Pháp Thoại Video và Audio." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:#0a0a0a; --bg2:#111; --bg3:#1a1a1a;
      --surface:#1e1e1e; --surface2:#252525;
      --border:rgba(255,255,255,0.08);
      --gold:#ccff00; --gold-dim:rgba(204,255,0,0.13); --gold-glow:rgba(204,255,0,0.28);
      --green:#22c55e; --red:#ef4444;
      --text:#f0f0f0; --text2:#a0a0a0; --text3:#555;
      --font-display:'Cormorant Garamond',serif;
      --font:'DM Sans',sans-serif;
      --radius:12px; --radius-sm:8px;
      --tr:0.22s cubic-bezier(0.4,0,0.2,1);
      --shadow:0 4px 24px rgba(0,0,0,0.55);
      --shadow-gold:0 0 22px rgba(204,255,0,0.18);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;min-height:100vh}
    img{display:block;max-width:100%}
    button{cursor:pointer;font-family:var(--font);border:none;background:none}
    a{color:inherit;text-decoration:none}
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:var(--bg2)}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

    @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:none;opacity:1}}

    /* ── HEADER ── */
    #header{
      position:sticky;top:0;z-index:100;
      background:rgba(10,10,10,0.9);backdrop-filter:blur(18px);
      border-bottom:1px solid var(--border);
      padding:11px 20px;
      display:flex;align-items:center;justify-content:space-between;gap:14px;
    }
    .header-logo{display:flex;align-items:center;gap:9px;flex-shrink:0}
    .logo-svg{width:34px;height:34px}
    .logo-text{font-family:var(--font-display);font-size:1.35rem;font-weight:600}
    .logo-text span{color:var(--gold)}
    .header-search{flex:1;max-width:480px;position:relative}
    .header-search input{
      width:100%;background:var(--surface);border:1px solid var(--border);border-radius:40px;
      color:var(--text);font-family:var(--font);font-size:.88rem;
      padding:8px 38px 8px 15px;outline:none;transition:var(--tr);
    }
    .header-search input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-dim)}
    .header-search input::placeholder{color:var(--text3)}
    .search-icon{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;font-size:.88rem}
    #search-dropdown{
      position:absolute;top:calc(100% + 7px);left:0;right:0;
      background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
      max-height:380px;overflow-y:auto;display:none;z-index:200;box-shadow:var(--shadow);
    }
    #search-dropdown.open{display:block;animation:fadeUp .18s ease}
    .sri{padding:11px 14px;display:flex;gap:9px;align-items:flex-start;cursor:pointer;border-bottom:1px solid var(--border);transition:background var(--tr)}
    .sri:last-child{border-bottom:none}
    .sri:hover{background:var(--surface2)}
    .sri-badge{font-size:.68rem;padding:2px 8px;border-radius:20px;background:var(--gold-dim);color:var(--gold);flex-shrink:0;margin-top:2px}
    .sri-badge.v{background:rgba(239,68,68,.13);color:#f87171}
    .sri-badge.a{background:rgba(34,197,94,.13);color:var(--green)}
    .sri-title{font-size:.88rem;font-weight:500}
    .sri-sub{font-size:.75rem;color:var(--text2);margin-top:2px}
    .search-empty{padding:22px;text-align:center;color:var(--text3);font-size:.88rem}
    .header-auth{flex-shrink:0;position:relative}
    #btn-login{background:var(--gold);color:#000;font-weight:500;font-size:.83rem;padding:7px 17px;border-radius:40px;transition:var(--tr)}
    #btn-login:hover{opacity:.83}
    #user-avatar{width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);cursor:pointer;object-fit:cover;display:none}
    #user-menu{
      position:absolute;top:calc(100% + 7px);right:0;
      background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
      min-width:195px;box-shadow:var(--shadow);display:none;z-index:300;
    }
    #user-menu.open{display:block;animation:fadeUp .18s ease}
    .um-head{padding:13px 15px;border-bottom:1px solid var(--border)}
    .um-name{font-weight:500;font-size:.88rem}
    .um-email{font-size:.75rem;color:var(--text3)}
    .um-item{padding:10px 15px;display:flex;align-items:center;gap:9px;font-size:.86rem;color:var(--text2);cursor:pointer;transition:var(--tr)}
    .um-item:hover{background:var(--surface2);color:var(--text)}
    .um-item.danger:hover{color:var(--red)}

    /* ── MAIN ── */
    main{max-width:1200px;margin:0 auto;padding:0 16px 60px}
    .sec-head{display:flex;align-items:center;justify-content:space-between;margin:38px 0 18px}
    .sec-title{font-family:var(--font-display);font-size:clamp(1.35rem,3vw,1.85rem);font-weight:600;display:flex;align-items:center;gap:9px}
    .sec-badge{font-size:.72rem;padding:2px 9px;border-radius:20px;border:1px solid var(--border);color:var(--text3);font-family:var(--font);font-weight:400}

    /* ── CARDS ── */
    .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
    .scroll-row{overflow-x:auto;padding-bottom:6px}
    .scroll-row .card-grid{grid-template-columns:repeat(6,175px);width:max-content}
    .card{
      background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
      overflow:hidden;cursor:pointer;
      transition:transform var(--tr),border-color var(--tr),box-shadow var(--tr);
      animation:fadeUp .35s ease both;
    }
    .card:hover{transform:translateY(-4px);border-color:rgba(204,255,0,.28);box-shadow:0 8px 30px rgba(0,0,0,.4),var(--shadow-gold)}
    .card-thumb{width:100%;aspect-ratio:16/9;background:var(--bg3);position:relative;overflow:hidden}
    .card.shorts .card-thumb{aspect-ratio:9/16}
    .card-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .38s ease}
    .card:hover .card-thumb img{transform:scale(1.05)}
    .play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.38);opacity:0;transition:opacity var(--tr)}
    .card:hover .play-overlay{opacity:1}
    .play-icon{width:46px;height:46px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;color:#000;font-size:1.1rem}
    .card-prog{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.08)}
    .card-prog-bar{height:100%;background:var(--gold)}
    .card-body{padding:13px}
    .card-src{font-size:.68rem;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
    .card-title{font-size:.92rem;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .card-desc{font-size:.78rem;color:var(--text2);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px}
    .btn-learn{background:var(--gold-dim);color:var(--gold);font-size:.78rem;font-weight:500;padding:5px 13px;border-radius:20px;transition:var(--tr)}
    .btn-learn:hover{background:var(--gold);color:#000}
    .done-badge{font-size:.7rem;color:var(--green)}

    /* skeleton */
    .sk{background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:var(--radius-sm)}
    .sk-card{border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
    .sk-thumb{height:152px}
    .sk-body{padding:13px}
    .sk-line{height:11px;margin-bottom:8px}
    .sk-w60{width:60%}.sk-w80{width:80%}

    /* ── MODAL ── */
    #overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(8px);z-index:500;display:none;align-items:flex-end;justify-content:center}
    #overlay.open{display:flex}
    @media(min-width:700px){#overlay{align-items:center;padding:20px}}
    #modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:780px;max-height:93vh;overflow-y:auto;animation:fadeUp .25s ease;position:relative}
    @media(min-width:700px){#modal{border-radius:var(--radius)}}
    .modal-bar{position:sticky;top:0;background:var(--bg2);padding:11px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);z-index:2}
    .modal-bar-title{font-family:var(--font-display);font-size:1.05rem;font-weight:600}
    .modal-x{width:30px;height:30px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:1rem;transition:var(--tr)}
    .modal-x:hover{background:var(--surface2);color:var(--text)}
    #modal-body{padding:18px}

    /* reader */
    .r-book{font-size:.75rem;color:var(--gold);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
    .r-title{font-family:var(--font-display);font-size:clamp(1.4rem,4vw,1.9rem);margin-bottom:6px}
    .r-pali{font-style:italic;color:var(--text2);font-size:.88rem}
    .r-desc{color:var(--text2);font-size:.88rem;margin-top:10px;line-height:1.7}
    .verse-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
    .verse-num{font-size:.72rem;color:var(--gold);margin-bottom:8px;font-weight:500}
    .verse-pali{font-style:italic;color:var(--text3);font-size:.83rem;line-height:1.7;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)}
    .verse-vi{font-family:var(--font-display);font-size:1.12rem;line-height:1.8;margin-bottom:10px}
    .verse-note{font-size:.83rem;color:var(--text2);line-height:1.7;padding-top:9px;border-top:1px solid var(--border)}
    .s-block{margin-bottom:26px}
    .s-block h3{font-family:var(--font-display);font-size:1.15rem;color:var(--gold);margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--gold-dim)}
    .s-text{line-height:1.9;font-size:.93rem;color:var(--text);white-space:pre-wrap}
    .video-wrap{width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
    .video-wrap iframe{width:100%;height:100%;border:none}
    .spotify-wrap{width:100%;border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
    .spotify-wrap iframe{width:100%;border:none}
    .btn-mark{display:inline-flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:9px 17px;border-radius:40px;font-size:.83rem;transition:var(--tr);margin-bottom:26px;cursor:pointer}
    .btn-mark.done{border-color:var(--green);color:var(--green);background:rgba(34,197,94,.09)}
    .btn-mark:hover:not(.done){border-color:var(--gold);color:var(--gold)}

    /* comments */
    .cmt-section{margin-top:30px;padding-top:22px;border-top:1px solid var(--border)}
    .cmt-title{font-family:var(--font-display);font-size:1.15rem;margin-bottom:18px;display:flex;align-items:center;gap:8px}
    .cmt-count{font-size:.75rem;background:var(--surface2);padding:2px 9px;border-radius:20px;font-family:var(--font);font-weight:400;color:var(--text2)}
    .cmt-form{display:flex;gap:11px;margin-bottom:22px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px}
    .cmt-av{width:34px;height:34px;border-radius:50%;background:var(--surface2);flex-shrink:0;object-fit:cover}
    .cmt-input-wrap{flex:1}
    .cmt-input{width:100%;background:transparent;border:none;color:var(--text);font-family:var(--font);font-size:.88rem;resize:none;outline:none;min-height:56px}
    .cmt-input::placeholder{color:var(--text3)}
    .cmt-actions{display:flex;justify-content:flex-end;margin-top:7px}
    .btn-send{background:var(--gold);color:#000;font-weight:500;font-size:.82rem;padding:7px 17px;border-radius:20px;transition:var(--tr)}
    .btn-send:hover{opacity:.83}
    .cmt-login{padding:15px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);text-align:center;color:var(--text2);font-size:.88rem;margin-bottom:18px}
    .cmt-login span{color:var(--gold);cursor:pointer;text-decoration:underline}
    .cmt-item{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid var(--border);animation:fadeUp .25s ease}
    .cmt-item:last-child{border-bottom:none}
    .ci-av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0}
    .ci-name{font-weight:500;font-size:.88rem}
    .ci-time{font-size:.72rem;color:var(--text3);margin-left:7px}
    .ci-text{font-size:.88rem;color:var(--text2);line-height:1.6;margin-top:3px}
    .cmt-empty{padding:20px;text-align:center;color:var(--text3);font-size:.86rem}
    .spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .55s linear infinite;display:inline-block}

    /* toast */
    #toast-wrap{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:7px}
    .toast{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 17px;font-size:.88rem;box-shadow:var(--shadow);animation:slideIn .25s ease;display:flex;align-items:center;gap:7px;min-width:210px}
    .toast.s{border-color:var(--green)}
    .toast.e{border-color:var(--red)}

    /* footer */
    footer{text-align:center;padding:38px 20px;border-top:1px solid var(--border);color:var(--text3);font-size:.83rem;line-height:1.8}
    .ft-logo{font-family:var(--font-display);font-size:1.4rem;color:var(--text2);margin-bottom:7px}
    .ft-logo span{color:var(--gold)}

    @media(max-width:600px){
      .logo-text{display:none}
      .card-grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
      .scroll-row .card-grid{grid-template-columns:repeat(6,160px)}
    }
    @media(min-width:768px){#header{padding:13px 26px}main{padding:0 26px 60px}}
  </style>
</head>
<body>

<!-- HEADER -->
<header id="header">
  <div class="header-logo">
    <svg class="logo-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="18" cy="18" r="16.5" stroke="#ccff00" stroke-width="1.3"/>
      <ellipse cx="18" cy="21" rx="8.5" ry="5.5" fill="none" stroke="#ccff00" stroke-width="1.1"/>
      <ellipse cx="18" cy="21" rx="8.5" ry="5.5" fill="none" stroke="#ccff00" stroke-width="1.1" transform="rotate(60 18 21)"/>
      <ellipse cx="18" cy="21" rx="8.5" ry="5.5" fill="none" stroke="#ccff00" stroke-width="1.1" transform="rotate(-60 18 21)"/>

    </svg>
    <span class="logo-text">Tự <span>Học Phật</span></span>

  <div class="header-search">
    <input type="search" id="search-input" placeholder="Tìm kinh, pháp thoại, kệ ngôn…" autocomplete="off" />

    <div id="search-dropdown"></div>
  </div>

  <div class="header-auth">
    <button id="btn-login">Đăng nhập</button>
    <img id="user-avatar" src="" alt="avatar" />
    <div id="user-menu">
      <div class="um-head">
        <div class="um-name" id="u-name">—</div>
        <div class="um-email" id="u-email">—</div>

</header>

<!-- MAIN -->
<main>
  <div class="sec-head">
    <h2 class="sec-title"><span>⚡</span>Pháp Thoại Ngắn <span class="sec-badge">Shorts</span></h2>
  </div>
  <div class="scroll-row"><div class="card-grid" id="g-shorts"></div></div>

  <div class="sec-head"><h2 class="sec-title"><span>🎬</span>Pháp Thoại Video</h2></div>
  <div class="card-grid" id="g-videos"></div>

  <div class="sec-head"><h2 class="sec-title"><span>🎧</span>Trạm Nghe Pháp</h2></div>
  <div class="card-grid" id="g-audio"></div>

  <div class="sec-head"><h2 class="sec-title"><span>📜</span>Kinh Điển Nền Tảng</h2></div>
  <div class="card-grid" id="g-core"></div>

  <div class="sec-head"><h2 class="sec-title"><span>📚</span>Năm Bộ Kinh Nikaya</h2></div>
  <div class="card-grid" id="g-nikaya"></div>
</main>

<footer>
  <div class="ft-logo">Tự <span>Học Phật</span></div>
  <p>Phi lợi nhuận · Dịch: HT. Thích Minh Châu · Nguồn: Viện Nghiên Cứu PHVN</p>
  <p style="margin-top:6px">Hồi hướng công đức đến tất cả chúng sinh 🙏</p>
</footer>

<!-- MODAL -->
<div id="overlay">
  <div id="modal">
    <div class="modal-bar">
      <div class="modal-bar-title" id="modal-title"></div>
      <button class="modal-x" id="modal-x">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast-wrap"></div>

<!-- ═══════════════════════════════════════════════════════
     FIREBASE  9  COMPAT  –  browser CDN  (không cần bundler)
     Dùng "compat" để viết firebase.xxx() bình thường
════════════════════════════════════════════════════════ -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ════════════════════════════════════════════
   CONFIG
════════════════════════════════════════════ */
firebase.initializeApp({
  apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
  authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
  databaseURL: "https://thuvienphatgiao-fd07e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "thuvienphatgiao-fd07e",
  storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
  messagingSenderId: "342500331725",
  appId: "1:342500331725:web:32795cf0146210f8019984"
});

var auth  = firebase.auth();
var db    = firebase.firestore();
var rtdb  = firebase.database();

/* ════════════════════════════════════════════
   BAD WORDS
════════════════════════════════════════════ */
var BAD_WORDS = [
  'spam','lừa đảo','quảng cáo','đm','vcl','dmm','cút','địt','đụ',
  'fuck','shit','bitch','ass','hate','kill','murder','stupid','idiot'
];
function hasBad(t){ var l=t.toLowerCase(); return BAD_WORDS.some(function(w){return l.indexOf(w)!==-1;}); }

/* ════════════════════════════════════════════
   STATE
════════════════════════════════════════════ */
var CU   = null;   // current firebase user
var SD   = null;   // static data (data.json)
var PROG = {};     // user progress map
var CMT_REFS = {}; // active rtdb listeners by cid

/* ════════════════════════════════════════════
   UTILS
════════════════════════════════════════════ */
function esc(t){
  return String(t||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg, type){
  type = type||'i';
  var icons = {s:'✅',e:'❌',i:'ℹ️'};
  var el = document.createElement('div');
  el.className = 'toast' + (type==='s'?' s':type==='e'?' e':'');
  el.innerHTML = (icons[type]||'ℹ️') + ' ' + msg;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(function(){ el.remove(); }, 3400);
}
function ago(ms){
  var s = Math.floor((Date.now()-ms)/1000);
  if(s<60)    return 'Vừa xong';
  if(s<3600)  return Math.floor(s/60)+' phút trước';
  if(s<86400) return Math.floor(s/3600)+' giờ trước';
  return Math.floor(s/86400)+' ngày trước';
}
function skels(n){
  n = n||4;
  var out = '';
  for(var i=0;i<n;i++){
    out += '<div class="sk-card"><div class="sk-thumb sk"></div><div class="sk-body">'
         + '<div class="sk-line sk sk-w60"></div>'
         + '<div class="sk-line sk sk-w80"></div>'
         + '<div class="sk-line sk sk-w60"></div>'
         + '</div></div>';
  }
  return out;
}
function rand(){ return (Math.random()*0.28).toFixed(2); }

function openModal(title, html){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('modal-x').onclick = closeModal;
document.getElementById('overlay').addEventListener('click', function(e){
  if(e.target === document.getElementById('overlay')) closeModal();
});

function loadProgress(){
  if(!CU) return Promise.resolve();
  return db.collection('progress').doc(CU.uid).get()
    .then(function(snap){ if(snap.exists) PROG = snap.data(); })
    .catch(function(){});
}

function markRead(id){
  if(!CU){ toast('Hãy đăng nhập để lưu tiến độ','e'); return; }
  PROG[id] = true;
  db.collection('progress').doc(CU.uid).set(PROG, {merge:true})
    .then(function(){
      toast('Đã đánh dấu hoàn thành 🎉','s');
      document.querySelectorAll('[data-mark="'+id+'"]').forEach(function(el){
        el.classList.add('done');
        el.textContent = '✅ Đã học';
      });
    })
    .catch(function(){ toast('Lỗi lưu tiến độ','e'); });
}

function showProgress(){
  var done = Object.keys(PROG).filter(function(k){ return PROG[k]; });
  openModal('📖 Tiến Độ Học',
    '<div style="padding:6px 0">'
    + '<p style="color:var(--text2);margin-bottom:14px">Hoàn thành: <strong style="color:var(--gold)">'
    + done.length + '</strong> bài</p>'
    + (done.length
      ? done.map(function(id){ return '<div style="padding:8px 11px;background:var(--surface);border-radius:8px;margin-bottom:7px;font-size:.86rem">✅ '+esc(id)+'</div>'; }).join('')
      : '<p style="color:var(--text3)">Chưa có bài nào. Hãy bắt đầu học hôm nay! 🙏</p>')
    + '</div>');
}

/* ════════════════════════════════════════════
   CARD BUILDER
════════════════════════════════════════════ */
function makeCard(o){
  // o = {id, title, desc, thumb, src, type, isShort, action}
  var done  = PROG[o.id];
  var icon  = o.type==='audio' ? '♫' : '▶';
  return '<div class="card'+(o.isShort?' shorts':'')+'" onclick="'+o.action+'" style="animation-delay:'+rand()+'s" tabindex="0">'
    + '<div class="card-thumb">'
    + '<img src="'+esc(o.thumb)+'" alt="'+esc(o.title)+'" loading="lazy"'
    + ' onerror="this.src=\'https://images.unsplash.com/photo-1499209974431-9dddcece7f88?w=400\'" />'
    + '<div class="play-overlay"><div class="play-icon">'+icon+'</div></div>'
    + '<div class="card-prog"><div class="card-prog-bar" style="width:'+(done?'100':'0')+'%"></div></div>'
    + '</div>'
    + '<div class="card-body">'
    + '<div class="card-src">'+esc(o.src||'')+'</div>'
    + '<div class="card-title">'+esc(o.title)+'</div>'
    + (o.desc ? '<div class="card-desc">'+esc(o.desc)+'</div>' : '')
    + '<div class="card-foot">'
    + '<button class="btn-learn">Học Ngay →</button>'
    + (done ? '<span class="done-badge">✅ Xong</span>' : '')
    + '</div></div></div>';
}

════════════════════════════════════════════ */
function renderVideos(){
  var gS = document.getElementById('g-shorts');
  var gV = document.getElementById('g-videos');
  gS.innerHTML = skels(5);
  gV.innerHTML = skels(4);

  var p1 = db.collection('shorts').orderBy('createdAt','desc').limit(10).get();
  var p2 = db.collection('videos').orderBy('createdAt','desc').limit(8).get();

  Promise.all([p1, p2]).then(function(results){
    var sSnap = results[0];
    var vSnap = results[1];

    var shortsHtml = '';
    sSnap.docs.forEach(function(d){
      var v = d.data();
      if(v.visible === false) return;
      shortsHtml += makeCard({
        id: d.id, title: v.title, src: v.teacher||'Pháp Thoại',
        thumb: 'https://i.ytimg.com/vi/'+v.youtube_id+'/hqdefault.jpg',
        type: 'video', isShort: true,
        action: "openVideo('"+v.youtube_id+"','"+esc(v.title).replace(/'/g,"&#39;")+"','"+d.id+"',true)"
      });
    });
    gS.innerHTML = shortsHtml || '<p style="color:var(--text3);padding:18px;font-size:.88rem">Chưa có Shorts. Admin thêm nội dung nhé.</p>';

    var videoHtml = '';
    vSnap.docs.forEach(function(d){
      var v = d.data();
      if(v.visible === false) return;
      videoHtml += makeCard({
        id: d.id, title: v.title, desc: v.description, src: v.teacher||'Pháp Thoại',
        thumb: 'https://i.ytimg.com/vi/'+v.youtube_id+'/hqdefault.jpg',
        type: 'video',
        action: "openVideo('"+v.youtube_id+"','"+esc(v.title).replace(/'/g,"&#39;")+"','"+d.id+"',false)"
      });
    });
    gV.innerHTML = videoHtml || '<p style="color:var(--text3);padding:18px;font-size:.88rem">Chưa có Video. Admin thêm nội dung nhé.</p>';

  }).catch(function(){
    gS.innerHTML = '<p style="color:var(--text3);padding:18px">Không thể tải – kiểm tra Firebase config.</p>';
    gV.innerHTML = gS.innerHTML;
  });
}

function renderAudio(){
  var g = document.getElementById('g-audio');
  g.innerHTML = skels(4);
  db.collection('audio').orderBy('createdAt','desc').limit(8).get()
    .then(function(snap){
      var html = '';
      snap.docs.forEach(function(d){
        var v = d.data();
        if(v.visible === false) return;
        html += makeCard({
          id: d.id, title: v.title, desc: v.description,
          src: 'Spotify · '+(v.teacher||''),
          thumb: v.thumbnail||'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=400',
          type: 'audio',
          action: "openAudio('"+v.spotify_id+"','"+esc(v.title).replace(/'/g,"&#39;")+"','"+d.id+"')"
        });
      });
      g.innerHTML = html || '<p style="color:var(--text3);padding:18px;font-size:.88rem">Chưa có Audio. Admin thêm nội dung nhé.</p>';
    })
    .catch(function(){ g.innerHTML = '<p style="color:var(--text3);padding:18px">Không thể tải audio.</p>'; });
}

function renderNikaya(){
  if(!SD || !SD.nikaya) return;
  var g = document.getElementById('g-nikaya');
  var actions = {
    truong_bo:"openNikaya('truong_bo')", trung_bo:"openNikaya('trung_bo')",
    tuong_ung_bo:"openNikaya('tuong_ung_bo')", tang_chi_bo:"openNikaya('tang_chi_bo')",
    tieu_bo:"openNikaya('tieu_bo')"
  };
  var html = '';
  Object.keys(SD.nikaya).forEach(function(k){
    var bo = SD.nikaya[k];
    html += makeCard({
      id: bo.id, title: bo.title, desc: bo.description,
      thumb: bo.thumbnail || 'https://images.unsplash.com/photo-1499209974431-9dddcece7f88?w=400',
      src: bo.titlePali+' · '+bo.totalSuttas+' kinh',
      type:'text', action: actions[k]||''
    });
  });
  g.innerHTML = html;
}

function renderAll(){
  renderCore();
  renderNikaya();
  renderVideos();
  renderAudio();
}

function openPhapcuu(){
  if(!SD || !SD.phap_cu) return;
  var pc = SD.phap_cu;
  var chapHtml = '';
  (pc.chapters||[]).forEach(function(ch){
    chapHtml += '<div class="s-block"><h3>'+ch.chapter+'. '+esc(ch.title)+'</h3>'
      + '<p style="color:var(--text2);font-size:.83rem;margin-bottom:14px">'+esc(ch.description||'')+'</p>';
    (ch.verses||[]).forEach(function(v){
      chapHtml += '<div class="verse-card">'
        + '<div class="verse-num">Kệ '+v.number+'</div>'
        + (v.pali ? '<div class="verse-pali">'+esc(v.pali)+'</div>' : '')
        + '<div class="verse-vi">'+esc(v.vietnamese||'')+'</div>'
        + (v.commentary ? '<div class="verse-note">'+esc(v.commentary)+'</div>' : '')
        + '</div>';
    });
    chapHtml += '</div>';
  });
  openModal('📜 '+pc.title,
    '<div class="r-book">📜 Tiểu Bộ Kinh (Khuddaka Nikāya)</div>'
    + '<h1 class="r-title">'+esc(pc.title)+'</h1>'
    + '<div class="r-pali">'+esc(pc.titlePali||'')+'</div>'
    + '<p class="r-desc">'+esc(pc.description||'')+'</p>'
    + '<button class="btn-mark'+(PROG['phap-cu']?' done':'')+'" style="margin-top:18px" data-mark="phap-cu" onclick="markRead(\'phap-cu\')">'
    + (PROG['phap-cu'] ? '✅ Đã học' : '📌 Đánh dấu đã đọc') + '</button>'
    + chapHtml + cmtHTML('phap-cu'));
  setTimeout(function(){ startComments('phap-cu'); }, 80);
}

function openChuyenPL(){

  var cpl = SD.chuyen_phap_luan;

    secHtml += '<div class="s-block"><h3>'+esc(s.title)+'</h3><div class="s-text">'+esc(s.content||'')+'</div></div>';

function openNikaya(key){
  if(!SD || !SD.nikaya || !SD.nikaya[key]) return;
  var bo = SD.nikaya[key];
  var list = '';
  (bo.suttas||[]).forEach(function(s, i){
    list += '<div class="card" style="animation-delay:'+(i*0.05).toFixed(2)+'s" onclick="openSutta(\''+key+'\',\''+esc(s.id)+'\')">'
      + '<div class="card-body">'
      + '<div class="card-src">'+esc(bo.abbreviation)+' '+esc(String(s.number||''))+'</div>'
      + '<div class="card-title">'+esc(s.title)+'</div>'
      + (s.description ? '<div class="card-desc">'+esc(s.description)+'</div>' : '')
      + '<div class="card-foot"><button class="btn-learn">Đọc →</button>'
      + (PROG[s.id] ? '<span class="done-badge">✅ Đã đọc</span>' : '')
      + '</div></div></div>';
  });
  openModal('📚 '+bo.title,
    '<div class="r-book">'+esc(bo.titlePali)+'</div>'
    + '<h1 class="r-title">'+esc(bo.title)+'</h1>'
    + '<p class="r-desc">'+esc(bo.description||'')+'</p>'
    + '<p style="margin:10px 0 18px;font-size:.82rem;color:var(--text3)">Hiển thị '+(bo.suttas&&bo.suttas.length||0)+' / '+bo.totalSuttas+' kinh mẫu</p>'
    + '<div class="card-grid">'+list+'</div>');
}

function openSutta(key, sid){
  if(!SD || !SD.nikaya || !SD.nikaya[key]) return;
  var bo = SD.nikaya[key];
  var s  = null;
  (bo.suttas||[]).forEach(function(x){ if(x.id===sid) s=x; });
  if(!s) return;
  var secHtml = '';
  (s.sections||[]).forEach(function(sec){
    secHtml += '<div class="s-block"><h3>'+esc(sec.title)+'</h3><div class="s-text">'+esc(sec.content||'')+'</div></div>';
  });
  openModal(s.title,
    '<div class="r-book">📚 '+esc(bo.title)+'</div>'
    + '<h1 class="r-title">'+esc(s.title)+'</h1>'
    + '<div class="r-pali">'+esc(s.titlePali||'')+'</div>'
    + '<p class="r-desc">'+esc(s.description||'')+'</p>'
    + '<button class="btn-mark'+(PROG[sid]?' done':'')+'" style="margin-top:18px" data-mark="'+sid+'" onclick="markRead(\''+sid+'\')">'
    + (PROG[sid] ? '✅ Đã học' : '📌 Đánh dấu đã đọc') + '</button>'
    + (s.linkedContent ? '<p style="padding:11px 13px;background:var(--surface);border-radius:8px;margin-bottom:14px;font-size:.86rem">👉 Xem đầy đủ tại: <strong style="color:var(--gold)">'+esc(s.linkedContent)+'</strong></p>' : '')
    + secHtml + cmtHTML(sid));
  setTimeout(function(){ startComments(sid); }, 80);
}

function cmtHTML(cid){
  var form = CU
    ? '<div class="cmt-form">'
      + '<img class="cmt-av" src="'+esc(CU.photoURL||'')+'" alt="av" '
      + 'onerror="this.src=\'https://api.dicebear.com/7.x/initials/svg?seed='+encodeURIComponent(CU.displayName||'?')+'\'" />'
      + '<div class="cmt-input-wrap">'
      + '<textarea class="cmt-input" id="ci-'+cid+'" placeholder="Chia sẻ suy nghĩ về bài học này… 🙏" rows="2"></textarea>'
      + '<div class="cmt-actions"><button class="btn-send" onclick="sendComment(\''+cid+'\')">Gửi 🙏</button></div>'
      + '</div></div>'
    : '<div class="cmt-login">Hãy <span onclick="auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())">đăng nhập</span> để tham gia thảo luận 🙏</div>';
  return '<div class="cmt-section" id="cs-'+cid+'">'
    + '<h3 class="cmt-title">💬 Thảo Luận <span class="cmt-count" id="cc-'+cid+'">0</span></h3>'
    + form
    + '<div id="cl-'+cid+'"><div class="cmt-empty"><div class="spinner"></div></div></div>'
    + '</div>';
}

function sendComment(cid){
  if(!CU) return;
  var el   = document.getElementById('ci-'+cid);
  var text = (el ? el.value : '').trim();
  if(!text) return;
  var bad = hasBad(text);
  rtdb.ref('comments/'+cid).push({
    uid: CU.uid, name: CU.displayName||'Ẩn danh',
    avatar: CU.photoURL||'', text: text, timestamp: Date.now(),
    contentId: cid, isHidden: bad, needsApproval: bad
  }).then(function(){
    if(el) el.value='';
    toast(bad ? 'Bình luận đang chờ kiểm duyệt 🙏' : 'Đã gửi 🙏', bad ? 'i' : 's');
  }).catch(function(){ toast('Lỗi gửi bình luận','e'); });
}

function startComments(cid){
  if(CMT_REFS[cid]) return;
  var listEl  = document.getElementById('cl-'+cid);
  var countEl = document.getElementById('cc-'+cid);
  if(!listEl) return;
  CMT_REFS[cid] = rtdb.ref('comments/'+cid).on('value', function(snap){
    var data = snap.val();
    if(!data){
      listEl.innerHTML = '<div class="cmt-empty">Chưa có bình luận nào. Hãy là người đầu tiên! 🌱</div>';
      if(countEl) countEl.textContent = '0';
      return;
    }
    var items = Object.values(data)
      .filter(function(c){ return !c.isHidden; })
      .sort(function(a,b){ return b.timestamp - a.timestamp; });
    if(countEl) countEl.textContent = items.length;
    listEl.innerHTML = items.length
      ? items.map(function(c){
          return '<div class="cmt-item">'
            + '<img class="ci-av" src="'+esc(c.avatar||'')+'" '
            + 'onerror="this.src=\'https://api.dicebear.com/7.x/initials/svg?seed='+encodeURIComponent(c.name||'?')+'\'" />'
            + '<div><span class="ci-name">'+esc(c.name||'Ẩn danh')+'</span>'
            + '<span class="ci-time">'+ago(c.timestamp||Date.now())+'</span>'
            + '<div class="ci-text">'+esc(c.text||'')+'</div></div>'
            + '</div>';
        }).join('')
      : '<div class="cmt-empty">Chưa có bình luận nào 🌱</div>';
  });
}

/* ════════════════════════════════════════════
   UNIVERSAL SEARCH
════════════════════════════════════════════ */
var _st;
var SI = document.getElementById('search-input');
var DROP = document.getElementById('search-dropdown');

SI.addEventListener('input', function(){
  clearTimeout(_st);
  var q = SI.value.trim();
  if(!q || q.length < 2){ DROP.classList.remove('open'); return; }
  _st = setTimeout(function(){ doSearch(q); }, 240);
});

SI.addEventListener('click', function(e){ e.stopPropagation(); });
DROP.addEventListener('click', function(e){ e.stopPropagation(); });

function doSearch(q){
  var ql = q.toLowerCase();
  var results = [];

  // Static data
  if(SD && SD.search_index && SD.search_index.entries){
    SD.search_index.entries.forEach(function(e){
      if((e.title+' '+e.text+' '+(e.keywords||'')).toLowerCase().indexOf(ql) !== -1){
        results.push({ id:e.id, title:e.title, text:e.text||'', type:'kinh', _src:'k' });
      }
    });
  }

  // Firestore (best-effort)
  var fsPromises = [
    db.collection('videos').get(),
    db.collection('audio').get(),
    db.collection('shorts').get()
  ];
  var types = ['video','audio','video'];

  Promise.all(fsPromises).then(function(snaps){
    snaps.forEach(function(snap, i){
      snap.docs.forEach(function(d){
        var v = d.data();
        if(v.visible === false) return;
        if((v.title+' '+(v.description||'')).toLowerCase().indexOf(ql) !== -1){
          results.push({ id:d.id, title:v.title, type:types[i], _src:'fs', data:v });
        }
      });
    });
    renderDrop(results.slice(0,8), q);
  }).catch(function(){ renderDrop(results.slice(0,8), q); });
}

function renderDrop(results, q){
  if(!results.length){
    DROP.innerHTML = '<div class="search-empty">Không tìm thấy kết quả cho "<strong>'+esc(q)+'</strong>"</div>';
  } else {
    DROP.innerHTML = results.map(function(r){
      var badge = 'Kinh', bCls = '';
      if(r.type==='video'){ badge='Video'; bCls='v'; }
      if(r.type==='audio'){ badge='Audio'; bCls='a'; }
      var action = '';
      if(r._src==='k')          action = "closeDrop();openStaticById('"+r.id+"')";
      else if(r.type==='video') action = "closeDrop();openVideo('"+esc(r.data&&r.data.youtube_id||'')+"','"+esc(r.title).replace(/'/g,"&#39;")+"','"+r.id+"',false)";
      else if(r.type==='audio') action = "closeDrop();openAudio('"+esc(r.data&&r.data.spotify_id||'')+"','"+esc(r.title).replace(/'/g,"&#39;")+"','"+r.id+"')";
      var sub = (r.text || (r.data&&r.data.description)||'').substring(0,60);
      return '<div class="sri" onclick="'+action+'">'
        + '<span class="sri-badge '+bCls+'">'+badge+'</span>'
        + '<div><div class="sri-title">'+esc(r.title)+'</div>'
        + '<div class="sri-sub">'+esc(sub)+(sub.length===60?'…':'')+'</div>'
        + '</div></div>';
    }).join('');
  }
  DROP.classList.add('open');
}

function closeDrop(){ DROP.classList.remove('open'); SI.value=''; }

function openStaticById(id){
  if(!SD) return;
  if(id==='phap-cu' || id.indexOf('pc-')===0){ openPhapcuu(); return; }
  if(id.indexOf('cpl-')===0){ openChuyenPL(); return; }
  if(SD.nikaya){
    var found = false;
    Object.keys(SD.nikaya).forEach(function(k){
      if(found) return;
      (SD.nikaya[k].suttas||[]).forEach(function(s){
        if(s.id===id){ found=true; openSutta(k,id); }
      });
    });
  }
}

loadStaticData().then(function(){ renderAll(); });
