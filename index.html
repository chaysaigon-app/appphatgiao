<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Phật Giáo - Học Chánh Pháp</title>
    <style>
        :root {
            --den: #000000;
            --nen-the: #1a1a1a;
            --vang-chanh: #ccff00; 
            --chu-trang: #ffffff;
            --xanh-kinh: #2e7d32;
            --cam-info: #e65100;
            --do-video: #c62828;
        }

        body { 
            background: var(--den); 
            color: var(--chu-trang); 
            font-family: Arial, sans-serif; 
            margin: 0; padding-bottom: 80px;
            font-size: 22px; 
        }

        header { text-align: center; padding: 30px; border-bottom: 3px solid var(--vang-chanh); background: #0a0a0a; }
        h1 { font-size: 38px; color: var(--vang-chanh); text-transform: uppercase; margin: 0; }

        /* Tra cứu theo từ khóa */
        .search-container { padding: 20px; display: flex; justify-content: center; background: #111; }
        #keywordSearch { 
            width: 90%; max-width: 600px; padding: 15px 25px; border-radius: 40px; 
            border: 2px solid var(--vang-chanh); font-size: 22px; outline: none; background: #000; color: #fff;
        }

        /* 20 Chủ đề có Icon */
        .vung-chu-de { padding: 20px; background: #0a0a0a; border-bottom: 2px solid #333; }
        .tieu-de-muc { color: var(--vang-chanh); font-size: 28px; font-weight: bold; margin-bottom: 15px; display: block; }
        .danh-sach-chu-de { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 15px; }
        .the-chu-de { 
            background: #263238; color: white; padding: 12px 25px; border-radius: 40px; 
            white-space: nowrap; border: 2px solid var(--vang-chanh); font-size: 20px; font-weight: bold; cursor: pointer;
        }

        /* Bố cục 3 Phần */
        .phan-muc { padding: 30px 20px; }
        .phan-tieu-de { 
            font-size: 32px; color: var(--vang-chanh); border-left: 10px solid; 
            padding-left: 15px; margin-bottom: 25px; text-transform: uppercase;
        }
        .vach-kinh { border-color: var(--xanh-kinh); }
        .vach-info { border-color: var(--cam-info); }
        .vach-video { border-color: var(--do-video); }

        /* Thẻ 9:16 Cố định - Chống tràn chữ */
        .luoi-noi-dung { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 30px; }
        .the-916 { 
            display: flex; background: var(--nen-the); border-radius: 20px; 
            overflow: hidden; height: 280px; border: 2px solid #333;
        }
        .anh-the { width: 160px; min-width: 160px; background-size: cover; background-position: center; }
        
        .noi-dung-the { 
            flex: 1; padding: 15px; display: flex; flex-direction: column; 
            justify-content: space-between; overflow: hidden; 
        }
        .noi-dung-the h3 { 
            margin: 0 0 10px; font-size: 24px; line-height: 1.2; color: #fff;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .noi-dung-the p { 
            font-size: 18px; color: #b0bec5; line-height: 1.4; margin: 0;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }
        .nut-hoc-ngay { 
            background: var(--vang-chanh); color: black; border: none; padding: 12px; 
            border-radius: 10px; font-size: 22px; font-weight: 900; cursor: pointer;
            width: 100%; text-transform: uppercase; margin-top: auto;
        }

        footer { text-align: center; padding: 40px; opacity: 0.5; font-size: 18px; border-top: 1px solid #333; }
    </style>
</head>
<body>

<header>
    <h1>THƯ VIỆN PHẬT GIÁO</h1>
</header>

<div class="search-container">
    <input type="text" id="keywordSearch" placeholder="Gõ từ khóa cần tìm (Ví dụ: Làm giàu, Sức khỏe...)" onkeyup="traCuu()">
</div>

<div class="vung-chu-de">
    <span class="tieu-de-muc">🪷 CHỌN CHỦ ĐỀ:</span>
    <div class="danh-sach-chu-de" id="topicList"></div>
</div>

<div class="phan-muc" id="phan-kinh">
    <div class="phan-tieu-de vach-kinh">📜 I. BẢN GỐC KINH NIKAYA</div>
    <div id="gridKinh" class="luoi-noi-dung"></div>
</div>

<div class="phan-muc" id="phan-info">
    <div class="phan-tieu-de vach-info">🎨 II. TÓM TẮT HÌNH ẢNH</div>
    <div id="gridInfo" class="luoi-noi-dung"></div>
</div>

<div class="phan-muc" id="phan-video">
    <div class="phan-tieu-de vach-video">📽️ III. BÀI GIẢNG VIDEO</div>
    <div id="gridVideo" class="luoi-noi-dung"></div>
</div>

<footer>
    <p>Học để Hiểu - Hiểu để Hành - Hành để Hạnh Phúc</p>
    <p>Hỗ trợ: Zalo 0909108890</p>
</footer>

<script>
    const topics = ["Chánh Kiến", "Làm Giàu", "Nuôi Con", "Vợ Chồng", "Báo Hiếu", "Sức Khỏe", "Nhân Quả", "Thiền Định", "Buông Xả", "Tái Sinh"];

    const sampleData = {
        kinh: [{title: "Kinh Pháp Môn Căn Bản", desc: "Cách nhìn đúng đắn về mọi sự vật hiện tượng để không lầm lạc.", img: "https://images.unsplash.com/photo-1542353436-312f0ebbf670?w=400"}],
        info: [{title: "Gieo Nhân Tài Lộc", desc: "5 cách tạo phước đức để giàu sang bền vững theo Chánh pháp.", img: "https://images.unsplash.com/photo-1579621970563-ebec7560ff3e?w=400"}],
        video: [{title: "Sức Mạnh Lòng Biết Ơn", desc: "Bài giảng về sự tri ân cha mẹ và cội nguồn hạnh phúc.", img: "https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=400"}]
    };

    function start() {
        document.getElementById('topicList').innerHTML = topics.map(t => `<div class="the-chu-de" onclick="locChuDe('${t}')">🪷 ${t}</div>`).join('');

        const draw = (data, elementId) => {
            document.getElementById(elementId).innerHTML = data.map(d => `
                <div class="the-916 item-the">
                    <div class="anh-the" style="background-image: url('${d.img}')"></div>
                    <div class="noi-dung-the">
                        <h3 class="search-title">${d.title}</h3>
                        <p>${d.desc}</p>
                        <button class="nut-hoc-ngay">Học Ngay</button>
                    </div>
                </div>
            `).join('');
        };

        draw(sampleData.kinh, 'gridKinh');
        draw(sampleData.info, 'gridInfo');
        draw(sampleData.video, 'gridVideo');
    }

    function traCuu() {
        let key = document.getElementById('keywordSearch').value.toLowerCase();
        let items = document.getElementsByClassName('item-the');
        for (let item of items) {
            let title = item.querySelector('.search-title').innerText.toLowerCase();
            item.style.display = title.includes(key) ? "flex" : "none";
        }
    }

    function locChuDe(name) {
        document.getElementById('keywordSearch').value = name;
        traCuu();
    }

    start();
</script>
</body>
</html>
