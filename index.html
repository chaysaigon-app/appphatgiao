<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Phật Giáo Nguyên Thủy</title>
    <style>
        :root { --main-color: #4a6741; --bg-color: #fdfcf0; --text-color: #2c3e50; --accent: #e0dcc5; }
        body { background: var(--bg-color); color: var(--text-color); font-family: 'Times New Roman', serif; margin: 0; line-height: 1.6; }
        header { text-align: center; padding: 60px 20px; border-bottom: 1px solid var(--accent); background: #fff; }
        
        /* Thanh tìm kiếm */
        .search-container { margin: -30px auto 30px; max-width: 600px; padding: 0 20px; }
        .search-box { display: flex; background: white; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 30px; overflow: hidden; }
        .search-box input { flex: 1; border: none; padding: 15px 25px; font-size: 16px; outline: none; }

        .container { max-width: 1200px; margin: auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        
        /* Thẻ bài kinh */
        .card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.05); transition: 0.3s; border: 1px solid #eee; cursor: pointer; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-color: var(--main-color); }
        .card-content { padding: 25px; text-align: center; }
        .card-tag { font-size: 12px; color: var(--main-color); font-weight: bold; margin-bottom: 10px; display: block; opacity: 0.7; }
        .card-title { margin: 0; font-size: 20px; color: #1a1a1a; line-height: 1.4; }
        
        /* Cửa sổ Modal đọc kinh văn */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); }
        .modal-content { background: #fdfcf0; margin: 5% auto; padding: 40px; border-radius: 10px; max-width: 800px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative; }
        .close-btn { position: sticky; top: -20px; float: right; font-size: 30px; cursor: pointer; color: #999; }
        .modal-body { font-size: 19px; line-height: 1.8; text-align: justify; white-space: pre-wrap; color: #2c3e50; }
        .modal-header { border-bottom: 2px solid var(--main-color); margin-bottom: 25px; padding-bottom: 15px; text-align: center; }

        .footer { text-align: center; padding: 60px; border-top: 1px solid var(--accent); margin-top: 80px; opacity: 0.8; }
    </style>
</head>
<body>

<header>
    <h1 style="letter-spacing: 2px; margin-bottom: 10px;">THƯ VIỆN PHẬT GIÁO</h1>
    <p style="font-style: italic; opacity: 0.8;">Bản dịch của Cố Hòa thượng Thích Minh Châu</p>
</header>

<div class="search-container">
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Tìm tên bài kinh hoặc mã số (MN-01)..." onkeyup="filterLessons()">
    </div>
</div>

<div class="container">
    <div id="lesson-grid" class="grid">
        </div>
</div>

<div id="contentModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div id="modalHeader" class="modal-header"></div>
        <div id="modalBody" class="modal-body"></div>
    </div>
</div>

<footer class="footer">
    <p>Hệ Thống Kinh Điển Nikaya Rời Rạc</p>
    <p>Liên hệ Admin: <strong>Zalo 0909108890</strong></p>
</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
        messagingSenderId: "342500331725",
        appId: "1:342500331725:web:32795cf0146210f8019984"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let libraryData = [];

    // Tải danh sách bài kinh từ kho Nikaya_Texts
    async function loadLibrary() {
        const grid = document.getElementById('lesson-grid');
        const querySnapshot = await getDocs(query(collection(db, "Nikaya_Texts"), orderBy("id")));
        
        grid.innerHTML = "";
        libraryData = [];

        querySnapshot.forEach((doc) => {
            const data = doc.data();
            libraryData.push(data);
            const card = document.createElement('div');
            card.className = 'card lesson-item';
            card.onclick = () => openModal(data.id);
            card.innerHTML = `
                <div class="card-content">
                    <span class="card-tag">${data.id}</span>
                    <h3 class="card-title">${data.title_vi || "Chưa có tiêu đề"}</h3>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // Mở cửa sổ đọc nội dung
    window.openModal = (id) => {
        const item = libraryData.find(d => d.id === id);
        if (item) {
            document.getElementById('modalHeader').innerHTML = `<h2>${item.id} - ${item.title_vi}</h2>`;
            // Ưu tiên hiển thị content_full, nếu không có thì lấy content
            document.getElementById('modalBody').innerText = item.content_full || item.content || "Nội dung đang được cập nhật...";
            document.getElementById('contentModal').style.display = "block";
            document.body.style.overflow = "hidden";
        }
    }

    window.closeModal = () => {
        document.getElementById('contentModal').style.display = "none";
        document.body.style.overflow = "auto";
    }

    // Tìm kiếm bài kinh
    window.filterLessons = () => {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const items = document.getElementsByClassName('lesson-item');
        libraryData.forEach((data, index) => {
            const text = (data.title_vi + " " + data.id).toLowerCase();
            items[index].style.display = text.includes(input) ? "flex" : "none";
        });
    }

    window.onclick = (event) => {
        if (event.target == document.getElementById('contentModal')) closeModal();
    }

    loadLibrary();
</script>
</body>
</html>
