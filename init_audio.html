<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Khởi tạo dữ liệu Audio - Firebase</title>
    <style>
        body { background: #000; color: #fff; font-family: Arial; text-align: center; padding: 100px; }
        .status-box { border: 2px solid #ccff00; padding: 40px; border-radius: 20px; display: inline-block; }
        button { padding: 20px 40px; background: #ccff00; border: none; font-weight: bold; cursor: pointer; border-radius: 10px; font-size: 20px; }
        #log { margin-top: 20px; text-align: left; max-width: 500px; margin-left: auto; margin-right: auto; color: #aaa; }
    </style>
</head>
<body>

<div class="status-box">
    <h2 style="color: #ccff00;">KHỞI TẠO COLLECTION: Audio_Lectures</h2>
    <p>Nhấn nút dưới đây để tạo cấu trúc và nạp dữ liệu mẫu lên Firebase.</p>
    <button id="runBtn">BẮT ĐẦU KHỞI TẠO</button>
    <div id="log"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
        messagingSenderId: "342500331725",
        appId: "1:342500331725:web:32795cf0146210f8019984"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const log = (msg) => {
        const div = document.getElementById('log');
        div.innerHTML += `> ${msg}<br>`;
    };

    document.getElementById('runBtn').onclick = async () => {
        document.getElementById('runBtn').disabled = true;
        log("Đang kết nối Firebase...");

        const sampleData = [
            { 
                title: "Bài Giảng 1: Ý Nghĩa Cuộc Đời", 
                spotify_id: "6rqS51HOAsv79vM6S96o3z", // Thay bằng ID thực tế của bạn
                hidden: false,
                createdAt: new Date()
            },
            { 
                title: "Bài Giảng 2: Buông Bỏ Phiền Não", 
                spotify_id: "4XfIAt20X096C6T5nId8L9", 
                hidden: false,
                createdAt: new Date()
            },
            { 
                title: "Bài Giảng 3: Hạnh Phúc Tại Tâm", 
                spotify_id: "0W39l6f62S9tQ8nI8lRj2u", 
                hidden: false,
                createdAt: new Date()
            }
        ];

        try {
            for (let item of sampleData) {
                await addDoc(collection(db, "Audio_Lectures"), item);
                log(`Đã thêm: ${item.title}`);
            }
            log("<b style='color:#ccff00'>HOÀN TẤT! Collection 'Audio_Lectures' đã được tạo thành công.</b>");
            alert("Đã khởi tạo xong dữ liệu Audio!");
        } catch (e) {
            log("<b style='color:red'>LỖI: " + e.message + "</b>");
        }
    };
</script>
</body>
</html>
