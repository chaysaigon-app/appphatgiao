<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nạp Kinh Điển Batch 2 - Trung Bộ Kinh</title>
    <style>
        body { font-family: 'Times New Roman', serif; background: #fdfcf0; padding: 40px; text-align: center; }
        .console { background: #1a1a1a; color: #00ff00; padding: 20px; border-radius: 8px; text-align: left; 
                   max-height: 500px; overflow-y: auto; font-family: monospace; font-size: 13px; margin-top: 20px; border: 2px solid #4a6741; }
        button { background: #8b4513; color: white; padding: 15px 40px; border: none; border-radius: 30px; 
                 cursor: pointer; font-size: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: 0.3s; }
        button:hover { background: #5d2e0d; transform: scale(1.05); }
        .status-msg { margin-top: 15px; font-weight: bold; color: #2c3e50; font-size: 1.2em; }
    </style>
</head>
<body>
    <h1>Hệ Thống Nạp Dữ Liệu - ĐỢT 2</h1>
    <p>Đang nạp: <strong>Trung Bộ Kinh (MN 11 - MN 20)</strong></p>
    
    <button onclick="startBatch2()">NẠP TIẾP 10 BÀI (11-20)</button>
    <div id="status" class="status-msg">Sẵn sàng nạp Batch 2...</div>
    <div id="log" class="console"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
          authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
          projectId: "thuvienphatgiao-fd07e",
          storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
          messagingSenderId: "342500331725",
          appId: "1:342500331725:web:32795cf0146210f8019984"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const batch2Data = [
            { id: "MN-11", title_vi: "Kinh Tiểu Tiếng Rống Sư Tử", title_en: "Shorter Discourse on the Lion's Roar", content: "Đức Phật khẳng định chỉ trong giáo pháp này mới có bốn hạng Thánh quả. Ngài giải thích về các loại chấp thủ: dục thủ, kiến thủ, giới cấm thủ và ngã luận thủ." },
            { id: "MN-12", title_vi: "Kinh Đại Tiếng Rống Sư Tử", title_en: "Great Discourse on the Lion's Roar", content: "Đức Phật thuyết về 10 Như Lai lực, 4 sự không sợ hãi và các cảnh giới tái sinh. Ngài kể về những khổ hạnh cực đoan Ngài đã trải qua trước khi thành đạo." },
            { id: "MN-13", title_vi: "Kinh Đại Khổ Uẩn", title_en: "Great Discourse on the Mass of Suffering", content: "Phân tích sâu về vị ngọt, sự nguy hiểm và sự xuất ly của các dục, các sắc pháp và các cảm thọ. Các dục mang lại ít vui nhưng nhiều khổ não." },
            { id: "MN-14", title_vi: "Kinh Tiểu Khổ Uẩn", title_en: "Shorter Discourse on the Mass of Suffering", content: "Giải thích tại sao dù biết dục là khổ nhưng con người vẫn không bỏ được: đó là do tham, sân, si còn ngự trị trong tâm." },
            { id: "MN-15", title_vi: "Kinh Tư Lượng", title_en: "Inference", content: "Tôn giả Moggallana dạy về cách tự soi xét mình (tư lượng). Một Tỳ-kheo phải tự quan sát xem mình có những ác pháp như khó nói, phẫn nộ, tật đố hay không." },
            { id: "MN-16", title_vi: "Kinh Tâm Hoang Vu", title_en: "Wilderness in the Mind", content: "Nêu ra 5 tâm hoang vu và 5 tâm triền buộc khiến hành giả không thể tiến bộ trên con đường giải thoát. Cách chặt đứt các xiềng xích này." },
            { id: "MN-17", title_vi: "Kinh Rừng Hoang", title_en: "Jungle Thickets", content: "Dạy cách chọn nơi cư trú: nếu một nơi ở (rừng, làng, thành phố) giúp chánh niệm tăng trưởng và phiền não giảm trừ thì nên ở lại, dù có đầy đủ vật dụng hay không." },
            { id: "MN-18", title_vi: "Kinh Mật Hoàn", title_en: "The Ball of Honey", content: "Phân tích về lộ trình của hý luận: từ xúc đến thọ, tưởng, tư duy và hý luận vọng tưởng. Cách chấm dứt cội rễ của mọi tranh chấp." },
            { id: "MN-19", title_vi: "Kinh Song Tầm", title_en: "Two Kinds of Thought", content: "Đức Phật kể cách Ngài phân loại tư duy làm hai: tầm thiện (ly dục, vô sân, vô hại) và tầm bất thiện. Cách từ bỏ tầm bất thiện để tâm an định." },
            { id: "MN-20", title_vi: "Kinh An Trú Tầm", title_en: "The Removal of Distracting Thoughts", content: "5 phương pháp để chế ngự các tầm ác khởi lên trong khi tu định: thay thế bằng tầm thiện, quán sự nguy hiểm, lờ đi, phân tích cội rễ, hoặc dùng ý chí chế ngự." }
        ];

        window.startBatch2 = async () => {
            const logElement = document.getElementById('log');
            const statusElement = document.getElementById('status');
            logElement.innerHTML = "> Đang kết nối Firebase để nạp Batch 2...<br>";

            try {
                for (let i = 0; i < batch2Data.length; i++) {
                    const item = batch2Data[i];
                    statusElement.innerText = `🔄 Đang nạp bài: ${item.id}...`;
                    
                    await setDoc(doc(db, "Nikaya_Library", item.id), {
                        ...item,
                        translator: "HT. Thích Minh Châu",
                        book: "trung-bo",
                        created_at: new Date()
                    });

                    logElement.innerHTML += `<span style="color:#00ff00">> [OK] Đã đưa vào kho: ${item.id} - ${item.title_vi}</span><br>`;
                    logElement.scrollTop = logElement.scrollHeight;
                }
                statusElement.innerText = "✅ THÀNH CÔNG BATCH 2 (11-20)!";
                logElement.innerHTML += "<br>--- KẾT THÚC BATCH 2 ---";
            } catch (error) {
                logElement.innerHTML += `<span style="color:#ff4444">> [LỖI]: ${error.message}</span><br>`;
                statusElement.innerText = "❌ CÓ LỖI XẢY RA.";
            }
        };
    </script>
</body>
</html>
