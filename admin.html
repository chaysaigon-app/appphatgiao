<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Nhập Liệu 3 Mục Lớn</title>
    <style>
        :root { --bg: #000; --vang: #ccff00; }
        body { background: var(--bg); color: #fff; font-family: Arial, sans-serif; padding: 20px; font-size: 20px; }
        .admin-box { max-width: 800px; margin: auto; border: 3px solid var(--vang); padding: 30px; border-radius: 20px; }
        
        /* 3 Nút chọn 3 mục lớn */
        .selector { display: flex; gap: 10px; margin-bottom: 25px; }
        .btn { flex: 1; padding: 20px; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; font-size: 18px; color: #fff; opacity: 0.5; }
        .btn.active { opacity: 1; border: 3px solid #fff; transform: scale(1.05); }
        .b-kinh { background: #2e7d32; } .b-info { background: #e65100; } .b-video { background: #c62828; }

        label { display: block; margin: 15px 0 5px; color: var(--vang); font-weight: bold; font-size: 22px; }
        input, textarea { width: 100%; padding: 15px; background: #111; border: 1px solid #555; color: #fff; border-radius: 10px; font-size: 20px; box-sizing: border-box; }
        textarea { height: 350px; line-height: 1.6; }
        .save-btn { width: 100%; padding: 25px; background: var(--vang); color: #000; border: none; border-radius: 15px; font-size: 28px; font-weight: 900; cursor: pointer; margin-top: 25px; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="admin-box">
    <h2 style="text-align: center; color: var(--vang); font-size: 32px;">NẠP DỮ LIỆU 3 MỤC LỚN</h2>

    <div class="selector">
        <button class="btn b-kinh active" onclick="setTab('kinh', this)">1. KINH GỐC</button>
        <button class="btn b-info" onclick="setTab('info', this)">2. INFOGRAPHIC</button>
        <button class="btn b-video" onclick="setTab('video', this)">3. VIDEO</button>
    </div>

    <label>Tựa bài học / Tựa Video:</label>
    <input type="text" id="title" placeholder="Nhập tựa bài...">

    <div id="detailFields">
        <label>Mô tả ngắn ngoài thẻ:</label>
        <input type="text" id="desc" placeholder="Tóm tắt cực ngắn...">
        <label>Link ảnh đại diện (9:16):</label>
        <input type="text" id="img" placeholder="Dán link hình ảnh...">
        <label id="contentLabel">Nội dung diễn giải chi tiết:</label>
        <textarea id="content" placeholder="Dán nội dung bài giảng chi tiết..."></textarea>
    </div>

    <div id="videoFields" style="display:none;">
        <label>Dán Link YouTube:</label>
        <input type="text" id="vidUrl" placeholder="Dán link video hoặc shorts tại đây...">
    </div>

    <button class="save-btn" onclick="save()">LƯU VÀO HỆ THỐNG</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
        messagingSenderId: "342500331725",
        appId: "1:342500331725:web:32795cf0146210f8019984"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let tab = 'kinh';

    window.setTab = (t, btn) => {
        tab = t;
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('detailFields').style.display = (t === 'video') ? 'none' : 'block';
        document.getElementById('videoFields').style.display = (t === 'video') ? 'block' : 'none';
        document.getElementById('contentLabel').innerText = (t === 'kinh') ? "Nguyên văn Kinh Nikaya:" : "Nội dung diễn giải chi tiết:";
    };

    function getID(url) {
        const reg = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/;
        const m = url.match(reg);
        return (m && m[2].length === 11) ? m[2] : url;
    }

    window.save = async () => {
        const cols = { kinh: "Nikaya_Texts", info: "Infographics_Library", video: "Video_Shorts" };
        const data = {
            title: document.getElementById('title').value,
            desc: document.getElementById('desc').value,
            img: document.getElementById('img').value,
            content_full: document.getElementById('content').value,
            youtube_id: tab === 'video' ? getID(document.getElementById('vidUrl').value) : ""
        };
        try {
            await addDoc(collection(db, cols[tab]), data);
            alert("Đã nạp thành công!"); location.reload();
        } catch (e) { alert("Lỗi: " + e.message); }
    };
</script>
</body>
</html>
