<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Nhập Liệu 4 Mục Lớn</title>
    <style>
        :root { --bg: #000; --vang: #ccff00; --tim: #7b1fa2; }
        body { background: var(--bg); color: #fff; font-family: Arial, sans-serif; padding: 20px; font-size: 20px; }
        .admin-box { max-width: 800px; margin: auto; border: 3px solid var(--vang); padding: 30px; border-radius: 20px; }
        
        /* 4 Nút chọn mục lớn */
        .selector { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .btn { flex: 1; min-width: 150px; padding: 15px; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; font-size: 16px; color: #fff; opacity: 0.4; transition: 0.3s; }
        .btn.active { opacity: 1; border: 3px solid #fff; transform: scale(1.05); }
        .b-kinh { background: #2e7d32; } 
        .b-info { background: #e65100; } 
        .b-video { background: #c62828; }
        .b-audio { background: var(--tim); }

        label { display: block; margin: 15px 0 5px; color: var(--vang); font-weight: bold; font-size: 22px; }
        input, textarea { width: 100%; padding: 15px; background: #111; border: 1px solid #555; color: #fff; border-radius: 10px; font-size: 20px; box-sizing: border-box; }
        textarea { height: 300px; line-height: 1.6; }
        .save-btn { width: 100%; padding: 25px; background: var(--vang); color: #000; border: none; border-radius: 15px; font-size: 28px; font-weight: 900; cursor: pointer; margin-top: 25px; text-transform: uppercase; }
        p.note { font-size: 14px; color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>

<div class="admin-box">
    <h2 style="text-align: center; color: var(--vang); font-size: 32px;">HỆ THỐNG NẠP DỮ LIỆU</h2>

    <div class="selector">
        <button class="btn b-kinh active" onclick="setTab('kinh', this)">1. KINH GỐC</button>
        <button class="btn b-info" onclick="setTab('info', this)">2. INFOGRAPHIC</button>
        <button class="btn b-video" onclick="setTab('video', this)">3. VIDEO</button>
        <button class="btn b-audio" onclick="setTab('audio', this)">4. AUDIO</button>
    </div>

    <label>Tựa bài học / Tựa Audio:</label>
    <input type="text" id="title" placeholder="Nhập tựa bài...">

    <div id="detailFields">
        <label>Mô tả ngắn ngoài thẻ:</label>
        <input type="text" id="desc" placeholder="Tóm tắt cực ngắn...">
        <label>Link ảnh đại diện (9:16):</label>
        <input type="text" id="img" placeholder="Dán link hình ảnh...">
        <label id="contentLabel">Nội dung diễn giải chi tiết:</label>
        <textarea id="content" placeholder="Dán nội dung bài giảng chi tiết..."></textarea>
    </div>

    <div id="videoFields" style="display:none;">
        <label>Dán Link YouTube:</label>
        <input type="text" id="vidUrl" placeholder="Dán link video hoặc shorts tại đây...">
    </div>

    <div id="audioFields" style="display:none;">
        <label>Spotify Link / ID:</label>
        <input type="text" id="spotifyUrl" placeholder="Dán link bài giảng Spotify tại đây...">
        <p class="note">Ví dụ: https://open.spotify.com/episode/6rqS51HOAsv79vM6S96o3z</p>
    </div>

    <button class="save-btn" id="btnSave">LƯU VÀO HỆ THỐNG</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDalHL1frXS_kkuTbg-HuFf7cd4UxKWOwE",
        authDomain: "thuvienphatgiao-fd07e.firebaseapp.com",
        projectId: "thuvienphatgiao-fd07e",
        storageBucket: "thuvienphatgiao-fd07e.firebasestorage.app",
        messagingSenderId: "342500331725",
        appId: "1:342500331725:web:32795cf0146210f8019984"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let currentTab = 'kinh';

    // Chuyển đổi giao diện Tab
    window.setTab = (tab, btn) => {
        currentTab = tab;
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // Hiển thị các ô nhập tương ứng
        document.getElementById('detailFields').style.display = (tab === 'kinh' || tab === 'info') ? 'block' : 'none';
        document.getElementById('videoFields').style.display = (tab === 'video') ? 'block' : 'none';
        document.getElementById('audioFields').style.display = (tab === 'audio') ? 'block' : 'none';
        
        if(tab === 'kinh') document.getElementById('contentLabel').innerText = "Nguyên văn Kinh Nikaya:";
        if(tab === 'info') document.getElementById('contentLabel').innerText = "Nội dung diễn giải chi tiết:";
    };

    // Hàm tách ID YouTube
    function getYoutubeID(url) {
        const reg = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/;
        const m = url.match(reg);
        return (m && m[2].length === 11) ? m[2] : url;
    }

    // Hàm tách ID Spotify
    function getSpotifyID(url) {
        const reg = /episode\/([a-zA-Z0-9]+)/;
        const m = url.match(reg);
        return (m && m[1]) ? m[1] : url.split('?')[0].split('/').pop();
    }

    // Lưu dữ liệu
    document.getElementById('btnSave').onclick = async () => {
        const collections = { 
            kinh: "Nikaya_Texts", 
            info: "Infographics_Library", 
            video: "Video_Shorts",
            audio: "Audio_Lectures"
        };

        const data = {
            title: document.getElementById('title').value,
            createdAt: new Date(),
            hidden: false
        };

        if (currentTab === 'video') {
            data.youtube_id = getYoutubeID(document.getElementById('vidUrl').value);
        } else if (currentTab === 'audio') {
            data.spotify_id = getSpotifyID(document.getElementById('spotifyUrl').value);
        } else {
            data.desc = document.getElementById('desc').value;
            data.img = document.getElementById('img').value;
            data.content_full = document.getElementById('content').value;
        }

        try {
            await addDoc(collection(db, collections[currentTab]), data);
            alert("Nạp thành công vào mục " + currentTab.toUpperCase() + "!");
            location.reload();
        } catch (e) {
            alert("Lỗi hệ thống: " + e.message);
        }
    };
</script>
</body>
</html>
